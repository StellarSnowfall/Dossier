<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Досье персонажей</title>
<style>
/* Базовые настройки */
*,*::before,*::after {box-sizing:border-box; margin:0; padding:0}
body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background-color: #0b0b12;
    background-image: linear-gradient(rgba(45, 45, 78, 0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(45, 45, 78, 0.1) 1px, transparent 1px);
    background-size: 20px 20px;
    color:#e2e8f0;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 20px;
}

/* Основной контейнер */
.dossier {
    width:100%;
    max-width:920px;
    border:1px solid #2d2d4e;
    border-radius:14px;
    overflow:hidden;
    background:#13131f;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 20px rgba(124, 58, 237, 0.05);
}

/* Шапка */
.header-bar {
    background: linear-gradient(90deg, #0a0a14, #13131f);
    padding:12px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #2d2d4e;
}
.header-left {display:flex; align-items:center; gap:12px}
.logo-img {
    height:38px; width:38px; 
    object-fit: contain;
    border-radius:50%; border:1px solid #2d2d4e;
    background: transparent;
}
.stamp {font-size:11px; color:#ef4444; letter-spacing:2px; text-transform:uppercase; font-weight:bold;}
.header-date {font-size:12px; color:#64748b; font-family:monospace; letter-spacing: 1px;}
.header-right {display:flex; align-items:center; gap:14px;}
.nav-link {font-size:11px; color:#64748b; padding:4px 12px; border:1px solid #2d2d4e; border-radius:20px; text-decoration:none; letter-spacing:1px; transition:all .2s ease;}
.nav-link:hover {color:#c4b5fd; border-color:#7c3aed;}

/* Выбор персонажа */
.selector-row {display:flex; gap:10px; padding:14px 24px; border-bottom:1px solid #2d2d4e; flex-wrap:wrap; background:#0f0f1a}
.selector-btn {
    font-size:12px; padding:6px 20px; border-radius:20px; border:1px solid #2d2d4e; 
    cursor:pointer; background:transparent; color:#888; transition:all .2s ease; font-family:inherit;
    text-transform: uppercase; letter-spacing: 1px; font-weight: 500;
}
.selector-btn:hover {border-color:#7c3aed; color:#fff;}
.selector-btn.active {background:#1e1040; border-color:#7c3aed; color:#c4b5fd; box-shadow: 0 0 12px rgba(124,58,237,0.3);}

/* Профиль */
.top-section {display:grid; grid-template-columns:180px 1fr; border-bottom:1px solid #2d2d4e}
.photo-area {
    background: transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center; 
    padding:24px 16px; border-right:1px solid #2d2d4e;
}
.avatar-circle {
    width:130px; height:130px; border-radius:50%; border:2.5px solid #7c3aed; 
    overflow:hidden; display:flex; align-items:center; justify-content:center;
    background: transparent;
    box-shadow: 0 0 15px rgba(124,58,237,0.25);
    transition: border-color 0.4s;
}
.avatar-circle img {
    width:100%; height:100%; 
    object-fit: contain;
    display:block;
    background: transparent;
}

.id-section {padding:24px; display:flex; flex-direction:column; justify-content: center; gap:14px}
.char-name {font-size:32px; font-weight:600; color:#f8fafc; letter-spacing: 0.5px;}
.meta-row {display:flex; gap:24px; margin-top:0px; flex-wrap:wrap}
.meta-item {display:flex; flex-direction:column; gap:4px}
.meta-label {font-size:10px; color:#64748b; text-transform:uppercase; letter-spacing:1px}
.meta-value {font-size:14px; color:#cbd5e1; font-weight:500}
.traits-row {display:flex; gap:8px; flex-wrap:wrap; margin-top:2px}

/* Трейты - бэйджи */
.trait-badge {
    font-size:11px; padding:4px 14px; border-radius:20px; border:1px solid; 
    cursor:pointer; transition:all .2s; user-select:none; font-weight: 500;
}
.trait-badge:hover {transform: translateY(-1px); filter: brightness(1.2);}
.trait-purple {border-color:#7c3aed; color:#c4b5fd; background:rgba(30,16,64,0.6)}
.trait-green {border-color:#16a34a; color:#86efac; background:rgba(5,46,22,0.6)}
.trait-orange {border-color:#ea580c; color:#fdba74; background:rgba(67,20,7,0.6)}
.trait-blue {border-color:#2563eb; color:#93c5fd; background:rgba(12,26,58,0.6)}

/* Вкладки */
.tab-row {display:flex; border-bottom:1px solid #2d2d4e; padding:0 24px; background:#0b0b12}
.tab {
    font-size:13px; padding:12px 20px; cursor:pointer; color:#64748b; 
    border-bottom:2px solid transparent; margin-bottom:-1px; background:none; 
    border-top:none; border-left:none; border-right:none; font-family:inherit; 
    transition:all .2s; font-weight: 500; text-transform: uppercase; letter-spacing: 1px;
}
.tab:hover {color:#cbd5e1}
.tab.active {color:#a78bfa; border-bottom-color:#7c3aed; text-shadow: 0 0 8px rgba(167,139,250,0.4);}

/* Основной контент */
.main-content {display:grid; grid-template-columns:1fr 320px}
.left-col {padding:24px; border-right:1px solid #2d2d4e; display:flex; flex-direction:column; gap:16px}
.section-title {
    font-size:11px; text-transform:uppercase; letter-spacing:2px; color:#64748b; 
    margin-bottom:12px; display:flex; align-items:center; gap:8px;
}
.section-title::before {content:''; display:block; width:4px; height:12px; background:#7c3aed; border-radius:2px;}
.bg-text {font-size:14px; color:#cbd5e1; line-height:1.7; text-align: justify;}

/* Статы */
.stat-rows {display:flex; flex-direction:column; gap:12px}
.stat-row {display:flex; align-items:center; gap:12px}
.stat-name {font-size:13px; color:#94a3b8; width:100px; flex-shrink:0; font-weight:500;}
.stat-bar-wrap {
    flex:1; height:8px; background:#1e293b; border-radius:4px; 
    position:relative; overflow:visible; border: 1px solid #334155;
}
.stat-zero-line {
    position:absolute; left:50%; top:-4px; bottom:-4px; width:2px; 
    background:#475569; z-index:2; transform:translateX(-50%); border-radius:1px;
}
.stat-bar {height:100%; border-radius:3px; position:absolute; top:0; transition:width .6s cubic-bezier(0.4, 0, 0.2, 1)}
.stat-bar.pos {left:50%; box-shadow: -2px 0 8px inset rgba(0,0,0,0.2);}
.stat-bar.neg {right:50%; box-shadow: 2px 0 8px inset rgba(0,0,0,0.2);}
.stat-val {font-size:14px; font-weight:700; width:36px; text-align:right; font-family:monospace;}

/* Правая колонка (Радар с Glass Effect) */
.right-col {
    padding:24px 16px; display:flex; flex-direction:column; gap:16px; 
    align-items:center; justify-content: flex-start;
    background: rgba(22, 22, 39, 0.45); /* Полупрозрачный фон */
    backdrop-filter: blur(12px); /* Эффект матового стекла */
    -webkit-backdrop-filter: blur(12px);
    border-left: 1px solid rgba(255, 255, 255, 0.03);
    box-shadow: inset 0px 0px 30px rgba(0, 0, 0, 0.4);
}
canvas {display:block; margin-top: 10px;}

/* Трейты - описание */
.trait-block {
    border-radius:8px; padding:14px 16px; border-left:4px solid; 
    margin-bottom:12px; background:rgba(30, 41, 59, 0.4);
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}
.trait-block.purple {border-color:#7c3aed; background:linear-gradient(90deg, rgba(124,58,237,0.05), transparent)}
.trait-block.orange {border-color:#ea580c; background:linear-gradient(90deg, rgba(234,88,12,0.05), transparent)}
.trait-block.green {border-color:#16a34a; background:linear-gradient(90deg, rgba(22,163,74,0.05), transparent)}
.trait-block.blue {border-color:#2563eb; background:linear-gradient(90deg, rgba(37,99,235,0.05), transparent)}
.trait-title {font-size:13px; font-weight:700; margin-bottom:6px; font-family:monospace; letter-spacing:0.5px;}
.trait-desc {font-size:13px; color:#94a3b8; line-height:1.6}

/* Футер */
.footer-bar {
    background:#0a0a14; border-top:1px solid #2d2d4e; padding:10px 24px; 
    display:flex; justify-content:space-between; align-items:center;
}
.footer-note {font-size:11px; color:#94a3b8; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;}
.footer-id {font-size:12px; font-family:monospace; color:#64748b; letter-spacing: 2px;}
.risk-critical { color: #450a0a; text-shadow: 0 0 8px #ef4444; font-weight: 800; }
.risk-high { color: #ef4444; font-weight: 700; }
.risk-medium { color: #facc15; font-weight: 700; }
.risk-low { color: #4ade80; font-weight: 700; }
.risk-minimal { color: #22d3ee; font-weight: 700; }

.hidden {display:none!important}
</style>
</head>
<body>
<div class="dossier" id="dossier-box">
  <div class="header-bar">
    <div class="header-left">
      <img class="logo-img" src="Img/logo.jpg" alt="logo">
      <span class="stamp">&#11041; Личное дело &#8212; Секретно</span>
    </div>
    <div class="header-right">
      <a class="nav-link" href="stats.html">Статистика →</a>
      <span class="header-date" id="doc-date">02/02/2026</span>
    </div>
  </div>
  
  <div class="selector-row" id="selector-row"></div>

  <div class="top-section">
    <div class="photo-area">
      <div class="avatar-circle" id="char-avatar">
        <img id="char-img" src="" alt="Avatar">
      </div>
    </div>
    <div class="id-section">
      <div class="char-name" id="char-name"></div>
      <div class="meta-row">
        <div class="meta-item">
          <span class="meta-label">Фракция</span>
          <span class="meta-value" id="char-faction"></span>
        </div>
      </div>
      <div class="traits-row" id="char-traits"></div>
    </div>
  </div>

  <div class="tab-row">
    <button class="tab active" onclick="switchTab('stats',this)">Характеристики</button>
    <button class="tab" onclick="switchTab('bio',this)">Бэкграунд</button>
    <button class="tab" id="tab-traits-btn" onclick="switchTab('traits',this)">Трейты</button>
  </div>

  <div class="main-content">
    <div class="left-col">
      <div id="tab-stats">
        <div class="section-title" id="stat-title-color">Базовые показатели (&minus;5 до +5)</div>
        <div class="stat-rows" id="stat-rows"></div>
      </div>
      <div id="tab-bio" class="hidden">
        <div class="section-title">Личный бэкграунд</div>
        <div class="bg-text" id="char-bg"></div>
        <div style="margin-top:20px"><div class="section-title">Мотивация</div><div class="bg-text" id="char-motiv"></div></div>
        <div style="margin-top:20px"><div class="section-title">Связи</div><div class="bg-text" id="char-links"></div></div>
      </div>
      <div id="tab-traits-content" class="hidden"></div>
    </div>
    
    <div class="right-col">
      <div class="section-title">Радар Анализ</div>
      <canvas id="radarCanvas" width="280" height="280"></canvas>
    </div>
  </div>

  <div class="footer-bar">
    <span class="footer-note" id="footer-note"></span>
    <span class="footer-id" id="footer-id"></span>
  </div>
</div>

function renderRiskFooter(riskKey) {
  const r = RISK[riskKey] || RISK.medium;
  return `Уровень риска: <span class="${r.cls}">${r.label}</span>`;
}

function initSelectors() {
  const row = document.getElementById('selector-row');
  row.innerHTML = chars.map((c, i) =>
    `<button type="button" class="selector-btn${i === 0 ? ' active' : ''}" onclick="loadChar(${i})">${c.name}</button>`
  ).join('');
}

let currentTab="stats";

function goToTrait(idx){
  const btn = document.getElementById("tab-traits-btn");
  switchTab("traits", btn);
  setTimeout(() => {
    const blocks = document.querySelectorAll("#tab-traits-content .trait-block");
    if(blocks[idx]) blocks[idx].scrollIntoView({behavior:"smooth", block:"nearest"});
  }, 60);
}

function loadChar(i) {
  document.querySelectorAll(".selector-btn").forEach((b,idx) => b.classList.toggle("active", idx===i));
  const c = chars[i];
  
  document.getElementById("doc-date").textContent = c.date;
  document.getElementById("char-img").src = c.img;
  
  const avatar = document.getElementById("char-avatar");
  avatar.style.borderColor = c.color;
  avatar.style.boxShadow = `0 0 15px ${c.color}35`;
  
  document.styleSheets[0].insertRule(`.section-title::before { background: ${c.color} !important; }`, document.styleSheets[0].cssRules.length);

  document.getElementById("char-name").textContent = c.name;
  document.getElementById("char-faction").textContent = c.faction;
  document.getElementById("char-traits").innerHTML = c.traits.map(t =>
    `<span class="trait-badge ${t.cls}" onclick="goToTrait(${t.idx})">${t.label}</span>`
  ).join("");
  
  document.getElementById("char-bg").textContent = c.bg;
  document.getElementById("char-motiv").textContent = c.motiv;
  document.getElementById("char-links").textContent = c.links;
  document.getElementById("footer-note").innerHTML = renderRiskFooter(c.risk || 'medium');
  document.getElementById("footer-id").textContent = c.id;
  
  document.getElementById("stat-rows").innerHTML = c.stats.map(s => {
    const pct = Math.abs(s.val) / 5 * 50;
    const isPos = s.val >= 0;
    const vc = s.val > 0 ? "#86efac" : s.val < 0 ? "#f87171" : "#94a3b8";
    return `<div class="stat-row">
      <span class="stat-name">${s.name}</span>
      <div class="stat-bar-wrap">
        <div class="stat-zero-line"></div>
        <div class="stat-bar ${isPos ? "pos" : "neg"}" style="width:${pct}%; background:${s.color}"></div>
      </div>
      <span class="stat-val" style="color:${vc}">${s.val > 0 ? "+" : ""}${s.val}</span>
    </div>`;
  }).join("");
  
  document.getElementById("tab-traits-content").innerHTML = c.traitBlocks.map(t =>
    `<div class="trait-block ${t.cls}">
      <div class="trait-title" style="color:${t.titleColor}">${t.title}</div>
      <div class="trait-desc">${t.desc}</div>
    </div>`
  ).join("");
  
  drawRadar(c);
}

function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("tab-stats").classList.toggle("hidden", tab!=="stats");
  document.getElementById("tab-bio").classList.toggle("hidden", tab!=="bio");
  document.getElementById("tab-traits-content").classList.toggle("hidden", tab!=="traits");
}

function drawRadar(c) {
  const canvas = document.getElementById("radarCanvas");
  const ctx = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  
  const cx = w/2, cy = h/2, R = 100; 
  const n = c.stats.length;
  const angles = c.stats.map((_,i) => -Math.PI/2 + (2*Math.PI/n)*i);
  
  // Отрисовка кругов сетки (четкая, без выделения 0 отметки)
  for(let v = -4; v <= 5; v++) {
    const r = (v+5)/10;
    ctx.beginPath();
    angles.forEach((a,i) => {
      const x = cx + Math.cos(a)*R*r, y = cy + Math.sin(a)*R*r;
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    });
    ctx.closePath();
    
    ctx.strokeStyle = "rgba(255,255,255,0.07)";
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }
  
  // Рисуем оси параметров
  angles.forEach(a => {
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.lineTo(cx + Math.cos(a)*R, cy + Math.sin(a)*R);
    ctx.strokeStyle = "rgba(255,255,255,0.12)"; 
    ctx.lineWidth = 0.8; 
    ctx.stroke();
  });
  
  // Рисуем фигуру характеристик (чистый, четкий неоновый полигон)
  ctx.beginPath();
  c.stats.forEach((s,i) => {
    const r = (s.val+5)/10;
    const x = cx + Math.cos(angles[i])*R*r, y = cy + Math.sin(angles[i])*R*r;
    i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
  });
  ctx.closePath();
  
  // Мягкое внутреннее свечение фигуры
  ctx.shadowColor = c.color;
  ctx.shadowBlur = 10;
  ctx.fillStyle = c.color + "33"; // 20% непрозрачности
  ctx.fill();
  
  ctx.strokeStyle = c.color; 
  ctx.lineWidth = 2.5;
  ctx.stroke();
  
  ctx.shadowBlur = 0; // Сброс теней
  
  // Рисуем сплошные цветные точки на углах (без белых центров)
  c.stats.forEach((s,i) => {
    const r = (s.val+5)/10;
    const x = cx + Math.cos(angles[i])*R*r, y = cy + Math.sin(angles[i])*R*r;
    ctx.fillStyle = c.color;
    ctx.beginPath(); ctx.arc(x,y,4.5,0,Math.PI*2); ctx.fill();
  });
  
  // Подписи характеристик (Высокая четкость)
  ctx.fillStyle = "rgba(241, 245, 249, 0.95)";
  ctx.font = "bold 11px -apple-system, sans-serif";
  ctx.textAlign = "center";
  c.stats.forEach((s,i) => {
    const a = angles[i];
    const x = cx + Math.cos(a)*(R+22);
    const y = cy + Math.sin(a)*(R+22);
    ctx.fillText(s.name, x, y+4);
  });
}
