body::after{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px);
background-size:100% 3px;
pointer-events:none;
opacity:.3;
}

.container{
max-width:1180px;
margin:auto;
border:1px solid var(--border);
background:var(--panel);
backdrop-filter:blur(14px);
border-radius:26px;
overflow:hidden;
box-shadow:
0 0 0 1px rgba(139,92,246,.05),
0 30px 80px rgba(0,0,0,.55);
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 28px;
border-bottom:1px solid var(--border);
background:rgba(7,7,17,.85);
}

.left-head{
display:flex;
align-items:center;
gap:16px;
}

.logo{
width:56px;
height:56px;
border-radius:50%;
border:1px solid rgba(255,255,255,.1);
box-shadow:0 0 25px rgba(139,92,246,.4);
}

.header-title{
font-size:13px;
letter-spacing:3px;
text-transform:uppercase;
color:#8a88a9;
}

.header-date{
font-family:monospace;
color:#5f6680;
font-size:12px;
}

.selectors{
display:flex;
gap:12px;
padding:18px 28px;
border-bottom:1px solid var(--border);
}

.selector{
padding:10px 20px;
background:transparent;
border:1px solid rgba(139,92,246,.18);
color:#8b92b0;
border-radius:999px;
cursor:pointer;
transition:.25s;
}

.selector:hover{
transform:translateY(-2px);
border-color:rgba(139,92,246,.5);
}

.selector.active{
background:rgba(139,92,246,.16);
color:#d9ceff;
box-shadow:0 0 20px rgba(139,92,246,.2);
}

.hero{
display:grid;
grid-template-columns:300px 1fr;
border-bottom:1px solid var(--border);
}

.profile-side{
padding:36px;
display:flex;
justify-content:center;
align-items:center;
border-right:1px solid var(--border);
position:relative;
}

.avatar-wrap{
position:relative;
}

.avatar{
width:220px;
height:220px;
border-radius:50%;
overflow:hidden;
border:3px solid var(--purple);
box-shadow:
0 0 40px rgba(139,92,246,.35),
0 0 100px rgba(139,92,246,.08);
position:relative;
z-index:2;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.avatar-ring{
position:absolute;
inset:-14px;
border-radius:50%;
border:1px solid rgba(139,92,246,.25);
animation:spin 18s linear infinite;
}

.avatar-ring::before{
content:"";
position:absolute;
width:16px;
height:16px;
border-radius:50%;
background:var(--purple);
top:0;
left:50%;
transform:translateX(-50%);
box-shadow:0 0 14px var(--purple);
}

@keyframes spin {
from{transform:rotate(0deg)}
to{transform:rotate(360deg)}
}

.info{
padding:34px;
display:flex;
flex-direction:column;
justify-content:center;
gap:16px;
animation:fade .35s ease;
}

@keyframes fade {
from{opacity:0;transform:translateY(8px)}
to{opacity:1;transform:none}
}

.name{
font-size:52px;
font-weight:700;
letter-spacing:.5px;
}

.class-tags{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.class-tag{
padding:8px 14px;
border-radius:999px;
font-size:12px;
background:rgba(139,92,246,.12);
border:1px solid rgba(139,92,246,.22);
color:#cdbfff;
}

.meta-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
margin-top:8px;
}

.meta-card{
padding:16px;
border:1px solid rgba(255,255,255,.05);
border-radius:18px;
background:rgba(255,255,255,.02);
}

.meta-label{
font-size:11px;
letter-spacing:2px;
text-transform:uppercase;
color:#69718d;
margin-bottom:6px;
}

.meta-value{
font-size:18px;
font-weight:600;
}

.status{
display:inline-flex;
align-items:center;
gap:10px;
padding:10px 14px;
border-radius:999px;
background:rgba(255,70,70,.1);
border:1px solid rgba(255,70,70,.25);
color:#ff9c9c;
width:max-content;
}

.dot{
width:10px;
height:10px;
border-radius:50%;
background:#ff4d4d;
box-shadow:0 0 12px #ff4d4d;
}

.main{
display:grid;
grid-template-columns:1.15fr .85fr;
}

.left{
padding:34px;
border-right:1px solid var(--border);
}

.section{
margin-bottom:30px;
}

.section-title{
font-size:12px;
letter-spacing:3px;
text-transform:uppercase;
color:#6d7390;
margin-bottom:18px;
}

.stat{
display:grid;
grid-template-columns:120px 1fr 42px;
align-items:center;
gap:14px;
margin-bottom:18px;
}

.stat-name{
font-size:14px;
color:#bcc4dd;
}

.bar{
height:10px;
background:#15182a;
border-radius:999px;
overflow:hidden;
position:relative;
}

.bar::after{
content:"";
position:absolute;
left:50%;
top:-4px;
bottom:-4px;
width:1px;
background:rgba(255,255,255,.12);
}

.fill{
height:100%;
border-radius:999px;
box-shadow:0 0 20px currentColor;
}

.value{
font-weight:700;
}

.bio{
line-height:1.9;
color:#9aa4bb;
font-size:14px;
}

.relationships{
display:flex;
flex-direction:column;
gap:14px;
}

.rel{
padding:16px;
border-radius:16px;
background:rgba(255,255,255,.02);
border:1px solid rgba(255,255,255,.05);
}

.right{
padding:34px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
}

#radar{
width:100%;
max-width:480px;
height:480px;
}

.traits{
width:100%;
margin-top:24px;
display:grid;
gap:14px;
}

.trait{
padding:18px;
border-radius:18px;
background:rgba(255,255,255,.03);
border-left:3px solid var(--purple);
box-shadow:0 0 20px rgba(0,0,0,.2);
}

.trait h3{
margin-bottom:8px;
}

.trait p{
font-size:13px;
line-height:1.8;
color:#9ba5bf;
}

.footer{
padding:18px 28px;
display:flex;
justify-content:space-between;
border-top:1px solid var(--border);
color:#5f6680;
font-family:monospace;
}

@media(max-width:980px){
.hero,.main{grid-template-columns:1fr}
.profile-side{border-right:none;border-bottom:1px solid var(--border)}
.left{border-right:none;border-bottom:1px solid var(--border)}
.meta-grid{grid-template-columns:1fr}
.name{font-size:42px}
#radar{height:360px}
}

</style>
</head>

function loadChar(i,btn){
const c = chars[i];

document.querySelectorAll(".selector").forEach(b=>b.classList.remove("active"));
if(btn) btn.classList.add("active");

document.getElementById("avatarImg").src = c.img;
document.getElementById("avatar").style.borderColor = c.color;
document.querySelector(".avatar-ring").style.borderColor = c.color;

document.getElementById("name").textContent = c.name;
document.getElementById("status").textContent = c.status;
document.getElementById("faction").textContent = c.faction;
document.getElementById("danger").textContent = c.danger;
document.getElementById("mind").textContent = c.mind;
document.getElementById("bio").textContent = c.bio;
document.getElementById("risk").textContent = c.risk;
document.getElementById("id").textContent = c.id;
document.getElementById("date").textContent = c.date;

document.getElementById("classes").innerHTML =
c.classes.map(v=>`<div class="class-tag">${v}</div>`).join("");

document.getElementById("relations").innerHTML =
c.relations.map(v=>`<div class="rel">${v}</div>`).join("");

document.getElementById("traits").innerHTML =
c.traits.map(v=>`
<div class="trait" style="border-left-color:${c.color}">
<h3>${v[0]}</h3>
<p>${v[1]}</p>
</div>
`).join("");

document.getElementById("stats").innerHTML =
c.stats.map(v=>{
const pct = Math.abs(v[1]) * 10;
const side = v[1] >= 0 ? "left:50%" : `left:${50-pct}%`;

return `
<div class="stat">
<div class="stat-name">${v[0]}</div>

<div class="bar">
<div class="fill"
style="
width:${pct}%;
${side};
position:absolute;
background:${v[2]};
color:${v[2]};
">
</div>
</div>

<div class="value" style="color:${v[2]}">
${v[1]>0?'+':''}${v[1]}
</div>
</div>
`;
}).join("");

drawRadar(c);
}

function drawRadar(c){
const canvas = document.getElementById("radar");
const ctx = canvas.getContext("2d");

ctx.clearRect(0,0,canvas.width,canvas.height);

const cx = 240;
const cy = 240;
const R = 170;

const angles = c.stats.map((_,i)=>
-Math.PI/2 + i*(Math.PI*2/c.stats.length)
);

for(let l=1;l<=6;l++){
const r = R*(l/6);

ctx.beginPath();

angles.forEach((a,i)=>{
const x = cx + Math.cos(a)*r;
const y = cy + Math.sin(a)*r;

if(i===0) ctx.moveTo(x,y);
else ctx.lineTo(x,y);
});

ctx.closePath();
ctx.strokeStyle = "rgba(255,255,255,.06)";
ctx.stroke();
}

angles.forEach(a=>{
ctx.beginPath();
ctx.moveTo(cx,cy);
ctx.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R);
ctx.strokeStyle="rgba(255,255,255,.08)";
ctx.stroke();
});

ctx.beginPath();

c.stats.forEach((s,i)=>{
const r = ((s[1]+5)/10)*R;

const x = cx + Math.cos(angles[i])*r;
const y = cy + Math.sin(angles[i])*r;

if(i===0) ctx.moveTo(x,y);
else ctx.lineTo(x,y);
});

ctx.closePath();

ctx.shadowColor = c.color;
ctx.shadowBlur = 28;

ctx.fillStyle = c.color + "35";
ctx.strokeStyle = c.color;
ctx.lineWidth = 3;
ctx.fill();
ctx.stroke();

ctx.shadowBlur = 0;

ctx.fillStyle = "#aeb7d3";
ctx.font = "14px Segoe UI";

c.stats.forEach((s,i)=>{
const x = cx + Math.cos(angles[i])*(R+30);
const y = cy + Math.sin(angles[i])*(R+30);

ctx.textAlign = "center";
ctx.fillText(s[0],x,y);
});
}

loadChar(0);

</script>

</body>
</html>
