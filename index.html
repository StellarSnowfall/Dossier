<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Досье персонажей</title>
<style>
/* Базовые настройки */
*,*::before,*::after {box-sizing:border-box; margin:0; padding:0}
body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background-color: #0b0b12;
    background-image: linear-gradient(rgba(45, 45, 78, 0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(45, 45, 78, 0.1) 1px, transparent 1px);
    background-size: 20px 20px;
    color:#e2e8f0;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 20px;
}

/* Основной контейнер */
.dossier {
    width:100%;
    max-width:920px;
    border:1px solid #2d2d4e;
    border-radius:14px;
    overflow:hidden;
    background:#13131f;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 20px rgba(124, 58, 237, 0.05);
}

/* Шапка */
.header-bar {
    background: linear-gradient(90deg, #0a0a14, #13131f);
    padding:12px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #2d2d4e;
}
.header-left {display:flex; align-items:center; gap:12px}
.logo-img {
    height:38px; width:38px; 
    object-fit: contain;
    border-radius:50%; border:1px solid #2d2d4e;
    background: transparent;
}
.stamp {font-size:11px; color:#ef4444; letter-spacing:2px; text-transform:uppercase; font-weight:bold;}
.header-date {font-size:12px; color:#64748b; font-family:monospace; letter-spacing: 1px;}
.header-right {display:flex; align-items:center; gap:14px;}
.nav-link {font-size:11px; color:#64748b; padding:4px 12px; border:1px solid #2d2d4e; border-radius:20px; text-decoration:none; letter-spacing:1px; transition:all .2s ease;}
.nav-link:hover {color:#c4b5fd; border-color:#7c3aed;}

/* Выбор персонажа */
.selector-row {display:flex; gap:10px; padding:14px 24px; border-bottom:1px solid #2d2d4e; flex-wrap:wrap; background:#0f0f1a}
.selector-btn {
    font-size:12px; padding:6px 20px; border-radius:20px; border:1px solid #2d2d4e; 
    cursor:pointer; background:transparent; color:#888; transition:all .2s ease; font-family:inherit;
    text-transform: uppercase; letter-spacing: 1px; font-weight: 500;
}
.selector-btn:hover {border-color:#7c3aed; color:#fff;}
.selector-btn.active {background:#1e1040; border-color:#7c3aed; color:#c4b5fd; box-shadow: 0 0 12px rgba(124,58,237,0.3);}

/* Профиль */
.top-section {display:grid; grid-template-columns:180px 1fr; border-bottom:1px solid #2d2d4e}
.photo-area {
    background: transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center; 
    padding:24px 16px; border-right:1px solid #2d2d4e;
}
.avatar-circle {
    width:130px; height:130px; border-radius:50%; border:2.5px solid #7c3aed; 
    overflow:hidden; display:flex; align-items:center; justify-content:center;
    background: transparent;
    box-shadow: 0 0 15px rgba(124,58,237,0.25);
    transition: border-color 0.4s;
}
.avatar-circle img {
    width:100%; height:100%; 
    object-fit: cover;
    display:block;
    background: transparent;
}
.mmr-rank-wrap {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 100%;
}
.mmr-rank-badge {
    width: 56px;
    height: 56px;
    object-fit: contain;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.45));
}
.mmr-rank-label {
    font-size: 10px;
    color: #64748b;
    text-align: center;
    letter-spacing: 0.3px;
    line-height: 1.3;
    max-width: 140px;
}

.id-section {padding:24px; display:flex; flex-direction:column; justify-content: center; gap:14px}
.char-name {font-size:32px; font-weight:600; color:#f8fafc; letter-spacing: 0.5px;}
.meta-row {display:flex; gap:24px; margin-top:0px; flex-wrap:wrap}
.meta-item {display:flex; flex-direction:column; gap:4px}
.meta-label {font-size:10px; color:#64748b; text-transform:uppercase; letter-spacing:1px}
.meta-value {font-size:14px; color:#cbd5e1; font-weight:500}
.traits-row {display:flex; gap:8px; flex-wrap:wrap; margin-top:2px}

/* Трейты - бэйджи */
.trait-badge {
    font-size:11px; padding:4px 14px; border-radius:20px; border:1px solid; 
    cursor:pointer; transition:all .2s; user-select:none; font-weight: 500;
}
.trait-badge:hover {transform: translateY(-1px); filter: brightness(1.2);}
.trait-purple {border-color:#7c3aed; color:#c4b5fd; background:rgba(30,16,64,0.6)}
.trait-green {border-color:#16a34a; color:#86efac; background:rgba(5,46,22,0.6)}
.trait-orange {border-color:#ea580c; color:#fdba74; background:rgba(67,20,7,0.6)}
.trait-blue {border-color:#2563eb; color:#93c5fd; background:rgba(12,26,58,0.6)}
.trait-red {border-color:#dc2626; color:#fca5a5; background:rgba(69,10,10,0.6)}
.trait-gold {border-color:#ca8a04; color:#fcd34d; background:rgba(69,52,9,0.6)}
.trait-gray {border-color:#64748b; color:#94a3b8; background:rgba(30,41,59,0.6)}

/* Вкладки */
.tab-row {display:flex; border-bottom:1px solid #2d2d4e; padding:0 24px; background:#0b0b12}
.tab {
    font-size:13px; padding:12px 20px; cursor:pointer; color:#64748b; 
    border-bottom:2px solid transparent; margin-bottom:-1px; background:none; 
    border-top:none; border-left:none; border-right:none; font-family:inherit; 
    transition:all .2s; font-weight: 500; text-transform: uppercase; letter-spacing: 1px;
}
.tab:hover {color:#cbd5e1}
.tab.active {color:#a78bfa; border-bottom-color:#7c3aed; text-shadow: 0 0 8px rgba(167,139,250,0.4);}

/* Основной контент */
.main-content {display:grid; grid-template-columns:1fr 320px}
.left-col {padding:24px; border-right:1px solid #2d2d4e; display:flex; flex-direction:column; gap:16px}
.section-title {
    font-size:11px; text-transform:uppercase; letter-spacing:2px; color:#64748b; 
    margin-bottom:12px; display:flex; align-items:center; gap:8px;
}
.section-title::before {content:''; display:block; width:4px; height:12px; background:#7c3aed; border-radius:2px;}
.bg-text {font-size:14px; color:#cbd5e1; line-height:1.7; text-align: justify;}

/* Статы */
.stat-rows {display:flex; flex-direction:column; gap:12px}
.stat-row {display:flex; align-items:center; gap:12px}
.stat-name {font-size:13px; color:#94a3b8; width:100px; flex-shrink:0; font-weight:500;}
.stat-bar-wrap {
    flex:1; height:8px; background:#1e293b; border-radius:4px; 
    position:relative; overflow:visible; border: 1px solid #334155;
}
.stat-zero-line {
    position:absolute; left:50%; top:-4px; bottom:-4px; width:2px; 
    background:#475569; z-index:2; transform:translateX(-50%); border-radius:1px;
}
.stat-bar {height:100%; border-radius:3px; position:absolute; top:0; transition:width .6s cubic-bezier(0.4, 0, 0.2, 1)}
.stat-bar.pos {left:50%; box-shadow: -2px 0 8px inset rgba(0,0,0,0.2);}
.stat-bar.neg {right:50%; box-shadow: 2px 0 8px inset rgba(0,0,0,0.2);}
.stat-val {font-size:14px; font-weight:700; width:36px; text-align:right; font-family:monospace;}

/* Правая колонка (Радар с Glass Effect) */
.right-col {
    padding:24px 16px; display:flex; flex-direction:column; gap:16px; 
    align-items:center; justify-content: flex-start;
    background: rgba(22, 22, 39, 0.45); /* Полупрозрачный фон */
    backdrop-filter: blur(12px); /* Эффект матового стекла */
    -webkit-backdrop-filter: blur(12px);
    border-left: 1px solid rgba(255, 255, 255, 0.03);
    box-shadow: inset 0px 0px 30px rgba(0, 0, 0, 0.4);
}
canvas {display:block; margin-top: 10px;}

/* Трейты - описание */
.trait-block {
    border-radius:8px; padding:14px 16px; border-left:4px solid; 
    margin-bottom:12px; background:rgba(30, 41, 59, 0.4);
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}
.trait-block.purple {border-color:#7c3aed; background:linear-gradient(90deg, rgba(124,58,237,0.05), transparent)}
.trait-block.orange {border-color:#ea580c; background:linear-gradient(90deg, rgba(234,88,12,0.05), transparent)}
.trait-block.green {border-color:#16a34a; background:linear-gradient(90deg, rgba(22,163,74,0.05), transparent)}
.trait-block.blue {border-color:#2563eb; background:linear-gradient(90deg, rgba(37,99,235,0.05), transparent)}
.trait-block.red {border-color:#dc2626; background:linear-gradient(90deg, rgba(220,38,38,0.05), transparent)}
.trait-block.gold {border-color:#ca8a04; background:linear-gradient(90deg, rgba(202,138,4,0.05), transparent)}
.trait-block.gray {border-color:#64748b; background:linear-gradient(90deg, rgba(100,116,139,0.05), transparent)}
.trait-title {font-size:13px; font-weight:700; margin-bottom:6px; font-family:monospace; letter-spacing:0.5px;}
.trait-desc {font-size:13px; color:#94a3b8; line-height:1.6}
.trait-mods {font-size:11px; margin-top:10px; font-family:monospace; letter-spacing:0.3px; color:#64748b;}
.trait-mods .mod-up {color:#86efac;}
.trait-mods .mod-down {color:#f87171;}

/* Футер */
.footer-bar {
    background:#0a0a14; border-top:1px solid #2d2d4e; padding:10px 24px; 
    display:flex; justify-content:space-between; align-items:center;
}
.footer-note {font-size:11px; color:#94a3b8; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;}
.footer-id {font-size:12px; font-family:monospace; color:#64748b; letter-spacing: 2px;}
.risk-critical { color: #450a0a; text-shadow: 0 0 8px #ef4444; font-weight: 800; }
.risk-high { color: #ef4444; font-weight: 700; }
.risk-medium { color: #facc15; font-weight: 700; }
.risk-low { color: #4ade80; font-weight: 700; }
.risk-minimal { color: #22d3ee; font-weight: 700; }

.hidden {display:none!important}
</style>
</head>

<div class="dossier" id="dossier-box">
  <div class="header-bar">
    <div class="header-left">

<script>
const STAT_NAMES = ['Адекватность', 'Скилл', 'Интрига', 'Орешки', 'Стойкость', 'Убеждение'];
const STAT_COLORS = {
  'Адекватность': '#a78bfa',
  'Скилл': '#60a5fa',
  'Интрига': '#f472b6',
  'Орешки': '#34d399',
  'Стойкость': '#fbbf24',
  'Убеждение': '#fb923c'
};

function clampStat(v) {
  return Math.max(-5, Math.min(5, Math.round(v * 2) / 2));
}

function computeStats(baseStats, traitBlocks) {
  const vals = {};
  STAT_NAMES.forEach(n => { vals[n] = baseStats[n] ?? 0; });
  (traitBlocks || []).forEach(t => {
    if (!t.mods) return;
    Object.entries(t.mods).forEach(([k, v]) => { vals[k] = (vals[k] ?? 0) + v; });
  });
  return STAT_NAMES.map(name => ({
    name,
    val: clampStat(vals[name]),
    color: STAT_COLORS[name]
  }));
}

function getCharStats(c) {
  if (c.baseStats) return computeStats(c.baseStats, c.traitBlocks);
  return c.stats;
}

function formatTraitMods(mods) {
  if (!mods) return '';
  return Object.entries(mods).map(([name, v]) => {
    const cls = v > 0 ? 'mod-up' : 'mod-down';
    const sign = v > 0 ? '+' : '';
    return `<span class="${cls}">${name} ${sign}${v}</span>`;
  }).join(' · ');
}

const RISK = {
  critical: { label: 'критический', cls: 'risk-critical' },
  high:     { label: 'высокий',     cls: 'risk-high' },
  medium:   { label: 'средний',     cls: 'risk-medium' },
  low:      { label: 'низкий',      cls: 'risk-low' },
  minimal:  { label: 'минимальный', cls: 'risk-minimal' }
};

const FACTION_COLORS = {

  'Культ Хаоса': '#7c3aed',

  'Достоинство': '#ca8a04'
};

function getFactionColor(faction) {
  return FACTION_COLORS[faction] || '#7c3aed';
}

function getFactionGlow(color) {
  if (color === '#1a1a1a') return 'rgba(255,255,255,0.22)';
  return color + '35';
}

function getFactionFill(color) {
  if (color === '#1a1a1a') return 'rgba(26,26,26,0.45)';
  return color + '33';
}

}

function initSelectors() {
  const row = document.getElementById('selector-row');
  row.innerHTML = chars.map((c, i) =>
    `<button type="button" class="selector-btn${i === 0 ? ' active' : ''}" onclick="loadChar(${i})">${c.name}</button>`
  ).join('');
}

let currentTab="stats";

function goToTrait(idx){
  const btn = document.getElementById("tab-traits-btn");
  switchTab("traits", btn);
  setTimeout(() => {
    const blocks = document.querySelectorAll("#tab-traits-content .trait-block");
    if(blocks[idx]) blocks[idx].scrollIntoView({behavior:"smooth", block:"nearest"});
  }, 60);
}

function loadChar(i) {
  document.querySelectorAll(".selector-btn").forEach((b,idx) => b.classList.toggle("active", idx===i));
  const c = chars[i];
  
  document.getElementById("doc-date").textContent = c.date;
  document.getElementById("char-img").src = c.img;
  
  const accent = getFactionColor(c.faction);
  const avatar = document.getElementById("char-avatar");
  avatar.style.borderColor = accent === '#1a1a1a' ? '#525252' : accent;
  avatar.style.boxShadow = `0 0 15px ${getFactionGlow(accent)}`;
  
  document.styleSheets[0].insertRule(`.section-title::before { background: ${accent === '#1a1a1a' ? '#525252' : accent} !important; }`, document.styleSheets[0].cssRules.length);

  document.getElementById("char-name").textContent = c.name;
  const factionEl = document.getElementById("char-faction");
  factionEl.textContent = c.faction;
  factionEl.style.color = accent === '#1a1a1a' ? '#a3a3a3' : accent;
  document.getElementById("char-traits").innerHTML = c.traits.map(t =>
    `<span class="trait-badge ${t.cls}" onclick="goToTrait(${t.idx})">${t.label}</span>`
  ).join("");
  
  document.getElementById("char-bg").textContent = c.bg;
  document.getElementById("char-motiv").textContent = c.motiv;
  document.getElementById("char-links").textContent = c.links;
  document.getElementById("footer-note").innerHTML = renderRiskFooter(c.risk || 'medium');
  document.getElementById("footer-id").textContent = c.id;
  
  const stats = getCharStats(c);

  document.getElementById("stat-rows").innerHTML = stats.map(s => {
    const pct = Math.abs(s.val) / 5 * 50;
    const isPos = s.val >= 0;
    const vc = s.val > 0 ? "#86efac" : s.val < 0 ? "#f87171" : "#94a3b8";
    return `<div class="stat-row">
      <span class="stat-name">${s.name}</span>
      <div class="stat-bar-wrap">
        <div class="stat-zero-line"></div>
        <div class="stat-bar ${isPos ? "pos" : "neg"}" style="width:${pct}%; background:${s.color}"></div>
      </div>
      <span class="stat-val" style="color:${vc}">${s.val > 0 ? "+" : ""}${s.val}</span>
    </div>`;
  }).join("");
  
  document.getElementById("tab-traits-content").innerHTML = c.traitBlocks.map(t => {
    const modsHtml = t.mods ? `<div class="trait-mods">${formatTraitMods(t.mods)}</div>` : '';
    return `<div class="trait-block ${t.cls}">
      <div class="trait-title" style="color:${t.titleColor}">${t.title}</div>
      <div class="trait-desc">${t.desc}</div>
      ${modsHtml}
    </div>`;
  }).join("");
  
  drawRadar({ ...c, stats, accent });
  updateMmrBadge(c.name);
}

function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("tab-stats").classList.toggle("hidden", tab!=="stats");
  document.getElementById("tab-bio").classList.toggle("hidden", tab!=="bio");
  document.getElementById("tab-traits-content").classList.toggle("hidden", tab!=="traits");
}

function drawRadar(c) {
  const canvas = document.getElementById("radarCanvas");
  const ctx = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  
  const cx = w/2, cy = h/2, R = 100; 
  const n = c.stats.length;
  const angles = c.stats.map((_,i) => -Math.PI/2 + (2*Math.PI/n)*i);
  
  // Отрисовка кругов сетки (четкая, без выделения 0 отметки)
  for(let v = -4; v <= 5; v++) {
    const r = (v+5)/10;
    ctx.beginPath();
    angles.forEach((a,i) => {
      const x = cx + Math.cos(a)*R*r, y = cy + Math.sin(a)*R*r;
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    });
    ctx.closePath();
    
    ctx.strokeStyle = "rgba(255,255,255,0.07)";
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }
  
  // Рисуем оси параметров
  angles.forEach(a => {
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.lineTo(cx + Math.cos(a)*R, cy + Math.sin(a)*R);
    ctx.strokeStyle = "rgba(255,255,255,0.12)"; 
    ctx.lineWidth = 0.8; 
    ctx.stroke();
  });
  
  // Рисуем фигуру характеристик (чистый, четкий неоновый полигон)
  ctx.beginPath();
  c.stats.forEach((s,i) => {
    const r = (s.val+5)/10;
    const x = cx + Math.cos(angles[i])*R*r, y = cy + Math.sin(angles[i])*R*r;
    i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
  });
  ctx.closePath();
  
  const accent = c.accent || getFactionColor(c.faction) || '#7c3aed';
  const stroke = accent === '#1a1a1a' ? '#525252' : accent;

  // Мягкое внутреннее свечение фигуры
  ctx.shadowColor = accent === '#1a1a1a' ? 'rgba(255,255,255,0.35)' : accent;
  ctx.shadowBlur = 10;
  ctx.fillStyle = getFactionFill(accent);
  ctx.fill();
  
  ctx.strokeStyle = stroke;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  
  ctx.shadowBlur = 0; // Сброс теней
  
  // Рисуем сплошные цветные точки на углах (без белых центров)
  c.stats.forEach((s,i) => {
    const r = (s.val+5)/10;
    const x = cx + Math.cos(angles[i])*R*r, y = cy + Math.sin(angles[i])*R*r;
    ctx.fillStyle = stroke;
    ctx.beginPath(); ctx.arc(x,y,4.5,0,Math.PI*2); ctx.fill();
  });
  
  // Подписи характеристик (Высокая четкость)
  ctx.fillStyle = "rgba(241, 245, 249, 0.95)";
  ctx.font = "bold 11px -apple-system, sans-serif";
  ctx.textAlign = "center";
  c.stats.forEach((s,i) => {
    const a = angles[i];
    const x = cx + Math.cos(a)*(R+22);
    const y = cy + Math.sin(a)*(R+22);
    ctx.fillText(s.name, x, y+4);
  });
}

function defaultPlayerRating(baseMmr) {
  return {
    hiddenMmr: baseMmr,
    mmr: null,
    calibrationPlayed: 0,
    manualOffset: 0,
    manualLock: false,
    calibratedAt: null
  };
}

function normalizeArchive(raw) {
  if (!raw) return null;
  const payload = Array.isArray(raw) ? { sessions: raw } : raw;
  if (!Array.isArray(payload.sessions)) return null;

  const players = payload.players?.length ? payload.players : chars.map(c => c.name);
  const games = (payload.games?.length ? payload.games : []).map(g => ({
    ...g,
    mmrType: g.mmrType || ((g.roles && g.roles.length) ? 'team' : 'ffa')
  }));

  const mmr = {
    ...structuredClone(DEFAULT_MMR),
    ...(payload.mmr || {}),
    ratings: { ...(payload.mmr?.ratings || {}) }
  };
  const base = mmr.baseMmr ?? DEFAULT_MMR.baseMmr;
  players.forEach(name => {
    if (!mmr.ratings[name]) mmr.ratings[name] = defaultPlayerRating(base);
  });

  return { players, games, sessions: payload.sessions, mmr };
}

function isSessionMmrEligible(session) {
  if (!session?.date || !ARCHIVE?.mmr?.startedAt) return false;
  return session.date >= ARCHIVE.mmr.startedAt;
}

function getGameMmrType(gameName) {
  const g = ARCHIVE.games.find(x => x.name === gameName);
  if (g?.mmrType) return g.mmrType;
  return (g?.roles?.length) ? 'team' : 'ffa';
}

function expectedScore(ratingA, ratingB) {
  return 1 / (1 + Math.pow(10, (ratingB - ratingA) / 400));
}

function applyEloPair(winnerRating, loserRating, k) {
  const e = expectedScore(winnerRating, loserRating);
  const delta = k * (1 - e);
  return { winDelta: delta, loseDelta: -delta };
}

function trackedRoles(session) {
  return (session.roles || []).filter(r => ARCHIVE.players.includes(r.player));
}

function resolveFfaDeltas(session, getRating, k) {
  const roles = trackedRoles(session);
  const winners = roles.filter(r => r.won);
  const losers = roles.filter(r => !r.won);
  if (!winners.length || !losers.length) return null;

  const deltas = {};
  const init = p => { if (deltas[p] === undefined) deltas[p] = 0; };

  winners.forEach(w => {
    losers.forEach(l => {
      const { winDelta, loseDelta } = applyEloPair(
        getRating(w.player), getRating(l.player), k / losers.length
      );
      init(w.player);
      init(l.player);
      deltas[w.player] += winDelta / winners.length;
      deltas[l.player] += loseDelta / winners.length;
    });
  });
  return deltas;
}

function resolveTeamDeltas(session, getRating, k) {
  const roles = trackedRoles(session);
  const winTeam = roles.filter(r => r.won).map(r => r.player);
  const loseTeam = roles.filter(r => !r.won).map(r => r.player);
  if (!winTeam.length || !loseTeam.length) return null;

  const rWin = winTeam.reduce((s, p) => s + getRating(p), 0) / winTeam.length;
  const rLose = loseTeam.reduce((s, p) => s + getRating(p), 0) / loseTeam.length;
  const { winDelta, loseDelta } = applyEloPair(rWin, rLose, k);

  const deltas = {};
  winTeam.forEach(p => { deltas[p] = winDelta; });
  loseTeam.forEach(p => { deltas[p] = loseDelta; });
  return deltas;
}

function computeSessionDeltas(session) {
  if (trackedRoles(session).length < 2) return null;
  const cfg = ARCHIVE.mmr;
  const getRating = p => cfg.ratings[p]?.hiddenMmr ?? cfg.baseMmr;
  const mmrType = getGameMmrType(session.game);
  return mmrType === 'ffa'
    ? resolveFfaDeltas(session, getRating, cfg.kFactor)
    : resolveTeamDeltas(session, getRating, cfg.kFactor);
}

function getPlayerK(player) {
  const cfg = ARCHIVE.mmr;
  const r = cfg.ratings[player];
  if (!r) return cfg.kFactor;
  return r.calibrationPlayed < cfg.calibrationGames ? cfg.kCalibration : cfg.kFactor;
}

function scaleDeltaForPlayer(delta, player) {
  return delta * (getPlayerK(player) / ARCHIVE.mmr.kFactor);
}

function applyPlayerDelta(player, delta, sessionDate) {
  const cfg = ARCHIVE.mmr;
  const r = cfg.ratings[player];
  if (!r || r.manualLock) return;

  r.hiddenMmr = Math.round(r.hiddenMmr + Math.round(scaleDeltaForPlayer(delta, player)));
  r.calibrationPlayed++;
  if (r.calibrationPlayed >= cfg.calibrationGames) {
    r.mmr = r.hiddenMmr;
    if (!r.calibratedAt) r.calibratedAt = sessionDate;
  }
}

function recalculateArchiveMmr() {
  if (!ARCHIVE) return;
  const cfg = ARCHIVE.mmr;
  const locked = {};

  ARCHIVE.players.forEach(name => {
    const r = cfg.ratings[name];
    if (r.manualLock) {
      locked[name] = { ...r };
    } else {
      r.hiddenMmr = cfg.baseMmr;
      r.mmr = null;
      r.calibrationPlayed = 0;
      r.calibratedAt = null;
    }
  });

  ARCHIVE.sessions
    .filter(isSessionMmrEligible)
    .sort((a, b) => new Date(a.date) - new Date(b.date))
    .forEach(session => {
      const deltas = computeSessionDeltas(session);
      if (!deltas) return;
      Object.entries(deltas).forEach(([player, delta]) => {
        if (!ARCHIVE.players.includes(player)) return;
        applyPlayerDelta(player, delta, session.date);
      });
    });

  Object.assign(cfg.ratings, locked);
}

function getDisplayMmr(player) {
  const r = ARCHIVE?.mmr?.ratings?.[player];
  if (!r || r.mmr === null) return null;
  return Math.round(r.mmr + (r.manualOffset || 0));
}

function getMmrLeaderboardRanks() {
  const rows = ARCHIVE.players
    .map(name => ({ name, mmr: getDisplayMmr(name) }))
    .filter(r => r.mmr !== null)
    .sort((a, b) => b.mmr - a.mmr);

  const rankMap = new Map();
  rows.forEach((row, i) => rankMap.set(row.name, i + 1));
  return rankMap;
}

function getMmrBadgeSrc(mmr, leaderboardRank) {
  if (leaderboardRank === 1) return 'Img/mmr/Titan-Top1.png';
  if (leaderboardRank >= 2 && leaderboardRank <= 10) return 'Img/mmr/Titan-Top.png';
  if (mmr >= 4000) return 'Img/mmr/Titan-default.png';

  let tierIdx = 0;
  for (let i = MMR_TIERS.length - 1; i >= 0; i--) {
    if (mmr >= MMR_TIERS[i].min) { tierIdx = i; break; }
  }
  const tier = MMR_TIERS[tierIdx];
  const nextMin = MMR_TIERS[tierIdx + 1]?.min ?? (tier.min + 1000);
  const span = nextMin - tier.min;
  const within = Math.max(0, mmr - tier.min);
  const star = Math.min(5, Math.max(1, Math.floor(within / (span / 5)) + 1));
  const file = tier.prefix === 'recruit'
    ? `recruit-${star}star.png`
    : `${tier.prefix}-${star}star.png`;
  return `Img/mmr/${file}`;
}

function updateMmrBadge(playerName) {
  const img = document.getElementById('char-mmr-badge');
  const label = document.getElementById('char-mmr-label');
  if (!img || !label) return;

  if (!ARCHIVE) {
    img.src = MMR_UNCALIBRATED;
    img.alt = 'Калибровка';
    label.textContent = 'Нет данных';
    return;
  }

  const display = getDisplayMmr(playerName);
  if (display === null) {
    const r = ARCHIVE.mmr.ratings[playerName];
    const cal = ARCHIVE.mmr.calibrationGames;
    const played = r?.calibrationPlayed ?? 0;
    img.src = MMR_UNCALIBRATED;
    img.alt = 'Калибровка';
    label.textContent = `Калибровка ${played}/${cal}`;
    return;
  }

  const rank = getMmrLeaderboardRanks().get(playerName);
  img.src = getMmrBadgeSrc(display, rank);
  img.alt = `${display} MMR`;
  label.textContent = `${display} MMR`;
}

async function loadArchiveMmr() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/archive?id=eq.1&select=data`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    if (res.ok) {
      const rows = await res.json();
      if (rows.length) ARCHIVE = normalizeArchive(rows[0].data);
    }
  } catch (e) {
    console.warn('MMR: Supabase недоступен', e);
  }

  if (!ARCHIVE) {
    try {
      const res = await fetch(ARCHIVE_FALLBACK_URL, { cache: 'no-store' });
      if (res.ok) ARCHIVE = normalizeArchive(await res.json());
    } catch (e) {
      console.warn('MMR: fallback недоступен', e);
    }
  }

  if (ARCHIVE) recalculateArchiveMmr();
}

async function boot() {
  initSelectors();
  await loadArchiveMmr();
  loadChar(0);
}

boot();
</script>
