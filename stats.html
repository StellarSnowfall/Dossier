<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Статистика — Игровой архив</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f1a;color:#e2e8f0;min-height:100vh;padding:24px 16px}
a{color:#a78bfa;text-decoration:none}
a:hover{text-decoration:underline}

/* Header */
.header-bar{max-width:1100px;margin:0 auto 24px;background:#0a0a14;border:1px solid #2d2d4e;border-radius:12px;padding:10px 20px;display:flex;justify-content:space-between;align-items:center}
.header-left{display:flex;align-items:center;gap:12px}
.logo-img{height:34px;width:34px;object-fit:cover;border-radius:50%;border:1px solid #2d2d4e}
.stamp{font-size:11px;color:#555;letter-spacing:1.5px;text-transform:uppercase}
.nav-link{font-size:12px;color:#64748b;padding:4px 12px;border:1px solid #2d2d4e;border-radius:20px;transition:all .15s}
.nav-link:hover{color:#c4b5fd;border-color:#7c3aed;text-decoration:none}

.container{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* Cards */
.card{background:#13131f;border:1px solid #2d2d4e;border-radius:12px;overflow:hidden}
.card-header{padding:12px 20px;border-bottom:1px solid #2d2d4e;display:flex;justify-content:space-between;align-items:center;background:#0f0f1a}
.card-title{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#555}
.card-body{padding:20px}

/* Winrate grid */
.winrate-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.wr-card{background:#0f0f1a;border:1px solid #2d2d4e;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.wr-name{font-size:13px;font-weight:500;color:#e2e8f0}
.wr-pct{font-size:22px;font-weight:600;font-family:monospace}
.wr-sub{font-size:11px;color:#555}
.wr-bar-wrap{height:3px;background:#1e293b;border-radius:2px;margin-top:4px}
.wr-bar{height:100%;border-radius:2px;background:#7c3aed;transition:width .4s}

/* Game tabs */
.game-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.gtab{font-size:12px;padding:5px 14px;border-radius:20px;border:1px solid #2d2d4e;cursor:pointer;background:transparent;color:#888;font-family:inherit;transition:all .15s}
.gtab:hover{border-color:#555;color:#ccc}
.gtab.active{background:#1e1040;border-color:#7c3aed;color:#c4b5fd}

/* Role table */
.role-table{width:100%;border-collapse:collapse;font-size:12px}
.role-table th{text-align:center;padding:8px 10px;color:#555;font-size:10px;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #2d2d4e;font-weight:500}
.role-table th:first-child{text-align:left}
.role-table td{padding:7px 10px;border-bottom:1px solid #1e293b;text-align:center;color:#94a3b8}
.role-table td:first-child{text-align:left;color:#e2e8f0;font-weight:500}
.role-table tr:last-child td{border-bottom:none}
.role-table tr:hover td{background:#0f0f1a}
.val-pos{color:#86efac}
.val-neg{color:#f87171}
.val-neu{color:#888}
.role-group-header td{background:#0a0a14;color:#7c3aed;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;padding:5px 10px}

/* Archive */
.archive-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filter-select{background:#0f0f1a;border:1px solid #2d2d4e;border-radius:8px;color:#94a3b8;padding:5px 10px;font-size:12px;font-family:inherit;cursor:pointer}
.filter-select:focus{outline:none;border-color:#7c3aed}

.session-block{margin-bottom:16px}
.session-date{font-size:11px;color:#7c3aed;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #1e293b}
.game-log{background:#0f0f1a;border:1px solid #1e293b;border-radius:8px;padding:12px 14px;margin-bottom:6px;display:flex;flex-direction:column;gap:4px}
.log-header{display:flex;justify-content:space-between;align-items:center}
.log-game{font-size:12px;font-weight:600;color:#c4b5fd}
.log-players{font-size:11px;color:#555}
.log-result{font-size:12px;color:#94a3b8}
.log-result span{color:#e2e8f0;font-weight:500}
.log-delete{font-size:10px;color:#374151;cursor:pointer;border:none;background:none;font-family:inherit;padding:2px 6px;border-radius:4px;transition:all .15s}
.log-delete:hover{color:#f87171;background:#1e293b}

/* Form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
.form-label{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:1px}
.form-input,.form-select,.form-textarea{background:#0f0f1a;border:1px solid #2d2d4e;border-radius:8px;color:#e2e8f0;padding:8px 12px;font-size:13px;font-family:inherit;transition:border-color .15s;width:100%}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:#7c3aed}
.form-textarea{resize:vertical;min-height:70px}
.form-select option{background:#13131f}

/* Role entry rows */
.role-entries{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.role-entry{display:grid;grid-template-columns:1fr 1fr 60px;gap:6px;align-items:center}
.role-entry .form-select,.role-entry .form-input{padding:6px 10px;font-size:12px}
.add-role-btn{font-size:12px;color:#7c3aed;border:1px dashed #2d2d4e;background:none;border-radius:6px;padding:5px 12px;cursor:pointer;font-family:inherit;transition:all .15s;margin-top:4px}
.add-role-btn:hover{border-color:#7c3aed;background:#1e1040}
.remove-role-btn{font-size:16px;color:#374151;border:none;background:none;cursor:pointer;line-height:1;padding:0 4px;transition:color .15s}
.remove-role-btn:hover{color:#f87171}

.btn-primary{background:#7c3aed;border:none;color:#fff;padding:9px 24px;border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:500;transition:background .15s}
.btn-primary:hover{background:#6d28d9}
.btn-secondary{background:transparent;border:1px solid #2d2d4e;color:#888;padding:9px 16px;border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;transition:all .15s}
.btn-secondary:hover{border-color:#555;color:#ccc}
.form-actions{display:flex;gap:8px;margin-top:4px}

.empty-state{text-align:center;padding:32px;color:#374151;font-size:13px}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:#1e1040;border:1px solid #7c3aed;color:#c4b5fd;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}

/* Players checkboxes */
.players-check{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.player-chip{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid #2d2d4e;cursor:pointer;user-select:none;color:#888;transition:all .15s}
.player-chip.selected{background:#1e1040;border-color:#7c3aed;color:#c4b5fd}

.hidden{display:none!important}
</style>
</head>

    <div class="card-header">
      <span class="card-title">Архив партий</span>
      <button class="btn-secondary" onclick="toggleForm()" id="form-toggle-btn" style="padding:5px 14px;font-size:12px">+ Добавить партию</button>
    </div>
    <div class="card-body">

      <!-- Add form -->
      <div id="add-form" class="hidden" style="margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid #1e293b">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Дата</label>
            <input class="form-input" type="date" id="f-date">
          </div>
          <div class="form-group">
            <label class="form-label">Игра</label>
            <select class="form-select" id="f-game" onchange="updateRoleOptions()">
              <option value="Секретный Гитлер">Секретный Гитлер</option>
              <option value="Письма Призрака">Письма Призрака</option>
              <option value="Накорми Кракена">Накорми Кракена</option>
              <option value="Доминион">Доминион</option>
            </select>
          </div>
          <div class="form-group full">
            <label class="form-label">Участники</label>
            <div class="players-check" id="players-check"></div>
          </div>
          <div class="form-group full">
            <label class="form-label">Победитель / результат</label>
            <input class="form-input" type="text" id="f-winner" placeholder="напр. Победа либералов, Победа — Медет">
          </div>
          <div class="form-group full">
            <label class="form-label">Роли игроков <span style="color:#444">(необязательно)</span></label>
            <div class="role-entries" id="role-entries"></div>
            <button class="add-role-btn" onclick="addRoleEntry()">+ Добавить роль</button>
          </div>
          <div class="form-group full">
            <label class="form-label">Заметки</label>
            <textarea class="form-textarea" id="f-notes" placeholder="Любые комментарии..."></textarea>
          </div>
        </div>
        <div class="form-actions" style="margin-top:12px">
          <button class="btn-primary" onclick="saveGame()">Сохранить партию</button>
          <button class="btn-secondary" onclick="toggleForm()">Отмена</button>
        </div>
      </div>

      <!-- Filters -->
      <div class="archive-filters">
        <select class="filter-select" id="filter-game" onchange="renderArchive()">
          <option value="">Все игры</option>
          <option>Секретный Гитлер</option>
          <option>Письма Призрака</option>
          <option>Накорми Кракена</option>
          <option>Доминион</option>
        </select>
        <select class="filter-select" id="filter-player" onchange="renderArchive()">
          <option value="">Все игроки</option>
        </select>
      </div>

      <div id="archive-list"><div class="empty-state">Нет записей</div></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const PLAYERS = ["Медет","Никита","Танай","Азирет","Дияр","Ануар","Нурсултан","Смурф","Куттыбек","Еркебулан","Мирас","Алан"];

const GAME_ROLES = {
  "Секретный Гитлер": ["Либерал","Фашист","Гитлер"],
  "Письма Призрака":  ["Призрак","Детектив","Эксперт","Свидетель","Убийца","Сообщник","Шантажист"],
  "Накорми Кракена":  ["Пират","Моряк","Ктулху"],
  "Доминион":         ["Победитель","Проигравший"]
};

// Win = if you were on the winning side. For role-based tracking we store per-entry: {player, role, won: true/false}
function loadGames(){ try{return JSON.parse(localStorage.getItem('boardgame_archive')||'[]')}catch{return[]} }
function saveGames(arr){ localStorage.setItem('boardgame_archive', JSON.stringify(arr)) }

// ── INIT ─────────────────────────────────────────────────────────────────────
let games = loadGames();
let activeRoleGame = "";

window.addEventListener('DOMContentLoaded', () => {
  // set default date
  document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
  buildPlayersCheck();
  addRoleEntry();
  updateRoleOptions();
  renderAll();
});

function renderAll(){
  renderWinrate();
  renderRoleTabs();
  renderRoleTable(activeRoleGame || (Object.keys(GAME_ROLES)[0]));
  renderArchive();
  updateFilterPlayer();
}

// ── WINRATE ───────────────────────────────────────────────────────────────────
function renderWinrate(){
  const grid = document.getElementById('winrate-grid');
  const stats = {};
  PLAYERS.forEach(p => stats[p] = {w:0, g:0});
  games.forEach(g => {
    (g.roles||[]).forEach(r => {
      if(!stats[r.player]) stats[r.player]={w:0,g:0};
      stats[r.player].g++;
      if(r.won) stats[r.player].w++;
    });
    // fallback: if no roles, count all participants
    if(!g.roles || g.roles.length===0){
      (g.players||[]).forEach(p => {
        if(!stats[p]) stats[p]={w:0,g:0};
        stats[p].g++;
      });
    }
  });
  const active = PLAYERS.filter(p => stats[p] && stats[p].g>0);
  document.getElementById('total-games-label').textContent = games.length + ' партий';
  if(!active.length){ grid.innerHTML='<div class="empty-state" style="grid-column:1/-1">Нет данных — добавьте первую партию</div>'; return; }
  grid.innerHTML = active.sort((a,b)=>(stats[b].g?stats[b].w/stats[b].g:0)-(stats[a].g?stats[a].w/stats[a].g:0)).map(p => {
    const s = stats[p];
    const pct = s.g ? Math.round(s.w/s.g*100) : 0;
    const col = pct>=60?'#86efac':pct>=40?'#fbbf24':'#f87171';
    return `<div class="wr-card">
      <div class="wr-name">${p}</div>
      <div class="wr-pct" style="color:${col}">${pct}%</div>
      <div class="wr-sub">${s.w}В / ${s.g-s.w}П / ${s.g} игр</div>
      <div class="wr-bar-wrap"><div class="wr-bar" style="width:${pct}%;background:${col}"></div></div>
    </div>`;
  }).join('');
}

// ── ROLE TABLE ────────────────────────────────────────────────────────────────
function renderRoleTabs(){
  const games_list = Object.keys(GAME_ROLES);
  if(!activeRoleGame) activeRoleGame = games_list[0];
  document.getElementById('role-tabs').innerHTML = games_list.map(g =>
    `<button class="gtab${g===activeRoleGame?' active':''}" onclick="setRoleGame('${g}')">${g}</button>`
  ).join('');
}

function setRoleGame(g){
  activeRoleGame = g;
  renderRoleTabs();
  renderRoleTable(g);
}

function renderRoleTable(gameName){
  const roles = GAME_ROLES[gameName]||[];
  const wrap = document.getElementById('role-table-wrap');
  // collect per player per role
  const data = {}; // data[player][role] = {w,l}
  PLAYERS.forEach(p => { data[p]={}; roles.forEach(r => data[p][r]={w:0,l:0}); });
  games.filter(g=>g.game===gameName).forEach(g=>{
    (g.roles||[]).forEach(re=>{
      if(!data[re.player]) data[re.player]={};
      if(!data[re.player][re.role]) data[re.player][re.role]={w:0,l:0};
      if(re.won) data[re.player][re.role].w++;
      else data[re.player][re.role].l++;
    });
  });
  const activePlayers = PLAYERS.filter(p => roles.some(r => (data[p]&&data[p][r]) && (data[p][r].w+data[p][r].l)>0));
  if(!activePlayers.length){ wrap.innerHTML='<div class="empty-state">Нет данных по этой игре</div>'; return; }
  const roleHeaders = roles.map(r=>`<th colspan="2" style="color:#94a3b8">${r}</th><th></th>`).join('');
  const roleSubHeaders = roles.map(r=>`<th>В</th><th>П</th><th style="color:#64748b">%</th>`).join('');
  const rows = activePlayers.map(p => {
    const cells = roles.map(r => {
      const s = data[p][r]||{w:0,l:0};
      const tot = s.w+s.l;
      const pct = tot ? Math.round(s.w/tot*100) : null;
      const pc = pct===null?'—':pct>=60?'val-pos':pct>=40?'val-neu':'val-neg';
      return `<td class="val-pos">${s.w||'—'}</td><td class="val-neg">${s.l||'—'}</td><td class="${pc}">${pct===null?'—':pct+'%'}</td>`;
    }).join('');
    return `<tr><td>${p}</td>${cells}</tr>`;
  }).join('');
  wrap.innerHTML=`<div style="overflow-x:auto"><table class="role-table">
    <thead><tr><th></th>${roleHeaders}</tr><tr><th>Игрок</th>${roleSubHeaders}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

// ── ARCHIVE ───────────────────────────────────────────────────────────────────
function renderArchive(){
  const fg = document.getElementById('filter-game').value;
  const fp = document.getElementById('filter-player').value;
  let filtered = games.filter(g =>
    (!fg || g.game===fg) &&
    (!fp || (g.players||[]).includes(fp)||(g.roles||[]).some(r=>r.player===fp))
  );
  filtered = [...filtered].sort((a,b)=>b.date.localeCompare(a.date));
  const list = document.getElementById('archive-list');
  if(!filtered.length){ list.innerHTML='<div class="empty-state">Нет записей</div>'; return; }
  // group by date
  const byDate = {};
  filtered.forEach(g=>{ if(!byDate[g.date]) byDate[g.date]=[]; byDate[g.date].push(g); });
  list.innerHTML = Object.keys(byDate).sort((a,b)=>b.localeCompare(a)).map(date=>{
    const label = formatDate(date);
    const entries = byDate[date].map(g => {
      const rolesText = (g.roles||[]).map(r=>`<span style="color:#94a3b8">${r.player}</span>: ${r.role}${r.won?' ✓':' ✗'}`).join(' · ');
      return `<div class="game-log">
        <div class="log-header">
          <span class="log-game">${g.game}</span>
          <button class="log-delete" onclick="deleteGame('${g.id}')">✕ удалить</button>
        </div>
        <div class="log-players">Участники: ${(g.players||[]).join(', ') || '—'}</div>
        <div class="log-result">Итог: <span>${g.winner||'—'}</span></div>
        ${rolesText?`<div style="font-size:11px;color:#555;margin-top:2px">${rolesText}</div>`:''}
        ${g.notes?`<div style="font-size:11px;color:#475569;margin-top:2px;font-style:italic">${g.notes}</div>`:''}
      </div>`;
    }).join('');
    return `<div class="session-block"><div class="session-date">${label}</div>${entries}</div>`;
  }).join('');
}

function formatDate(d){
  const [y,m,day]=d.split('-');
  const months=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  return `${parseInt(day)} ${months[parseInt(m)-1]} ${y}`;
}

function deleteGame(id){
  if(!confirm('Удалить эту запись?')) return;
  games = games.filter(g=>g.id!==id);
  saveGames(games);
  renderAll();
  toast('Запись удалена');
}

function updateFilterPlayer(){
  const sel = document.getElementById('filter-player');
  const cur = sel.value;
  const all = [...new Set(games.flatMap(g=>g.players||[]))].sort();
  sel.innerHTML = '<option value="">Все игроки</option>' + all.map(p=>`<option${p===cur?' selected':''}>${p}</option>`).join('');
}

// ── FORM ──────────────────────────────────────────────────────────────────────
function toggleForm(){
  const f = document.getElementById('add-form');
  const btn = document.getElementById('form-toggle-btn');
  const hidden = f.classList.toggle('hidden');
  btn.textContent = hidden ? '+ Добавить партию' : '✕ Закрыть';
}

function buildPlayersCheck(){
  const wrap = document.getElementById('players-check');
  wrap.innerHTML = PLAYERS.map(p=>
    `<span class="player-chip" data-player="${p}" onclick="togglePlayer(this)">${p}</span>`
  ).join('');
}

function togglePlayer(el){ el.classList.toggle('selected'); }

function getSelectedPlayers(){
  return [...document.querySelectorAll('.player-chip.selected')].map(el=>el.dataset.player);
}

function updateRoleOptions(){
  const game = document.getElementById('f-game').value;
  const roles = GAME_ROLES[game]||[];
  document.querySelectorAll('.role-select').forEach(sel=>{
    const cur = sel.value;
    sel.innerHTML = roles.map(r=>`<option${r===cur?' selected':''}>${r}</option>`).join('');
  });
}

function addRoleEntry(){
  const game = document.getElementById('f-game').value;
  const roles = GAME_ROLES[game]||[];
  const wrap = document.getElementById('role-entries');
  const div = document.createElement('div');
  div.className='role-entry';
  div.innerHTML=`
    <select class="form-select role-player">${PLAYERS.map(p=>`<option>${p}</option>`).join('')}</select>
    <select class="form-select role-select">${roles.map(r=>`<option>${r}</option>`).join('')}</select>
    <select class="form-select role-won"><option value="1">✓ Победа</option><option value="0">✗ Пораж.</option></select>
    <button class="remove-role-btn" onclick="this.parentElement.remove()">×</button>`;
  wrap.appendChild(div);
}

function saveGame(){
  const date   = document.getElementById('f-date').value;
  const game   = document.getElementById('f-game').value;
  const winner = document.getElementById('f-winner').value.trim();
  const notes  = document.getElementById('f-notes').value.trim();
  const players = getSelectedPlayers();
  if(!date||!game){ toast('Заполните дату и игру'); return; }
  const roles = [...document.querySelectorAll('.role-entry')].map(row=>({
    player: row.querySelector('.role-player').value,
    role:   row.querySelector('.role-select').value,
    won:    row.querySelector('.role-won').value==='1'
  }));
  const entry = { id: Date.now()+'', date, game, players, winner, roles, notes };
  games.unshift(entry);
  saveGames(games);
  // reset form
  document.getElementById('f-winner').value='';
  document.getElementById('f-notes').value='';
  document.getElementById('role-entries').innerHTML='';
  addRoleEntry();
  document.querySelectorAll('.player-chip').forEach(c=>c.classList.remove('selected'));
  toggleForm();
  renderAll();
  toast('Партия сохранена ✓');
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}
</script>
</body>
</html>
