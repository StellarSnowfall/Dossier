<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Статистика — Игровой архив</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f0f1a;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 20px 16px 40px;
}
a { color: #a78bfa; text-decoration: none; }

/* ── Header ── */
.header-bar {
    max-width: 1100px; margin: 0 auto 20px;
    background: #0a0a14; border: 1px solid #2d2d4e; border-radius: 12px;
    padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.logo-img { height: 38px; width: 38px; object-fit: contain; border-radius: 50%; border: 1px solid #2d2d4e; background: transparent; }
.stamp { font-size: 11px; color: #555; letter-spacing: 1.5px; text-transform: uppercase; }
.header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sync-pill {
    font-size: 11px; padding: 4px 10px; border-radius: 20px;
    border: 1px solid #2d2d4e; color: #64748b; display: flex; align-items: center; gap: 6px;
}
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #64748b; }
.sync-pill.ok { color: #86efac; border-color: #166534; }
.sync-pill.ok .sync-dot { background: #22c55e; }
.sync-pill.err { color: #fca5a5; border-color: #7f1d1d; }
.sync-pill.err .sync-dot { background: #ef4444; }
.nav-btn {
    background: #13131f; border: 1px solid #2d2d4e; color: #e2e8f0;
    padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: all 0.2s;
}
.nav-btn:hover { background: #1e1e2f; border-color: #a78bfa; }
.nav-btn.primary { background: #5b21b6; border-color: #7c3aed; color: #fff; }
.nav-btn.primary:hover { background: #6d28d9; }

.main-container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.section-card { background: #13131f; border: 1px solid #2d2d4e; border-radius: 14px; padding: 22px 24px; }
.section-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 18px; gap: 12px; flex-wrap: wrap;
}
.section-title { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #94a3b8; }
.section-meta { font-size: 12px; color: #64748b; }

/* ── Winrate cards ── */
.winrate-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.win-card {
    background: #0a0a14; border: 1px solid #2d2d4e; border-radius: 10px;
    padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 4px;
    position: relative;
}
.win-card.rank-gold {
    border: 2px solid transparent;
    background:
        linear-gradient(#0a0a14, #0a0a14) padding-box,
        linear-gradient(120deg, #78350f, #fcd34d, #fef08a, #f59e0b, #fcd34d, #92400e) border-box;
    background-size: 100% 100%, 220% 220%;
    animation: shimmer-gold 3.5s ease-in-out infinite;
    box-shadow: 0 0 16px rgba(250, 204, 21, 0.35), inset 0 0 12px rgba(250, 204, 21, 0.06);
}
.win-card.rank-silver {
    border: 2px solid transparent;
    background:
        linear-gradient(#0a0a14, #0a0a14) padding-box,
        linear-gradient(120deg, #475569, #e2e8f0, #f8fafc, #94a3b8, #cbd5e1, #64748b) border-box;
    background-size: 100% 100%, 220% 220%;
    animation: shimmer-silver 3.5s ease-in-out infinite;
    box-shadow: 0 0 14px rgba(203, 213, 225, 0.28), inset 0 0 10px rgba(226, 232, 240, 0.05);
}
.win-card.rank-bronze {
    border: 2px solid transparent;
    background:
        linear-gradient(#0a0a14, #0a0a14) padding-box,
        linear-gradient(120deg, #451a03, #d97706, #fdba74, #b45309, #f59e0b, #78350f) border-box;
    background-size: 100% 100%, 220% 220%;
    animation: shimmer-bronze 3.5s ease-in-out infinite;
    box-shadow: 0 0 14px rgba(217, 119, 6, 0.3), inset 0 0 10px rgba(245, 158, 11, 0.05);
}
@keyframes shimmer-gold {
    0%, 100% { background-position: 0 0, 0% 50%; }
    50% { background-position: 0 0, 100% 50%; }
}
@keyframes shimmer-silver {
    0%, 100% { background-position: 0 0, 0% 50%; }
    50% { background-position: 0 0, 100% 50%; }
}
@keyframes shimmer-bronze {
    0%, 100% { background-position: 0 0, 0% 50%; }
    50% { background-position: 0 0, 100% 50%; }
}
.win-card .name { font-size: 15px; font-weight: 700; color: #f8fafc; }
.win-card .pct { font-size: 32px; font-weight: 800; line-height: 1.1; }
.win-card .sub { font-size: 12px; color: #e2e8f0; font-family: monospace; margin-bottom: 10px; }
.win-card .bar { height: 4px; background: #1e293b; border-radius: 2px; overflow: hidden; }
.win-card .bar-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }

/* ── Game pills ── */
.pills-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.pill {
    font-size: 12px; padding: 8px 14px; border-radius: 20px; cursor: pointer;
    border: 1px solid #2d2d4e; background: #0a0a14; color: #94a3b8;
    font-family: inherit; transition: all 0.15s;
}
.pill:hover { color: #e2e8f0; border-color: #64748b; }
.pill.active { background: #5b21b6; border-color: #7c3aed; color: #fff; }
.pill.sm { padding: 7px 12px; font-size: 13px; border-radius: 999px; }
.pill.toggle { background: #0b0b15; }
.pill.toggle.active { background: rgba(124,58,237,0.22); border-color: #7c3aed; color: #e9d5ff; }
.pill.toggle.active::before { content: '✓'; margin-right: 8px; color: #c4b5fd; font-weight: 900; }
.pills-row.tight { gap: 10px; margin: 6px 0 16px; }

/* ── Role matrix table ── */
.table-wrap { overflow-x: auto; border: 1px solid #2d2d4e; border-radius: 10px; background: #0a0a14; }
.role-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
.role-table th {
    color: #64748b; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    padding: 10px 8px; border-bottom: 1px solid #2d2d4e; font-weight: 600; text-align: center;
}
.role-table th.player-col { text-align: left; padding-left: 16px; }
.role-table th.group { border-left: 1px solid #1e293b; }
.role-table td {
    padding: 11px 8px; border-bottom: 1px solid #13131f; text-align: center;
    color: #cbd5e1; font-variant-numeric: tabular-nums;
}
.role-table td.player-name { text-align: left; padding-left: 16px; font-weight: 600; color: #f8fafc; }
.role-table td.group { border-left: 1px solid #1a1a2e; }
.role-table td.pct-cell { font-weight: 700; color: #f8fafc; }
.role-table tr:last-child td { border-bottom: none; }
.role-table .dash { color: #475569; }

/* ── Archive ── */
.archive-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
.archive-toolbar .filters { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
.form-select, .form-input {
    background: #0a0a14; border: 1px solid #2d2d4e; border-radius: 8px;
    padding: 8px 12px; color: #f8fafc; font-size: 13px; font-family: inherit;
}
.form-select:focus, .form-input:focus { border-color: #a78bfa; outline: none; }
.date-label {
    font-size: 11px; color: #64748b; letter-spacing: 1px; text-transform: uppercase;
    margin: 16px 0 10px; padding-bottom: 6px; border-bottom: 1px solid #2d2d4e;
}
.log-card {
    background: #0a0a14; border: 1px solid #2d2d4e; border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px;
}
.log-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.log-game { font-weight: 700; font-size: 14px; }
.log-meta { font-size: 12px; color: #64748b; margin-top: 4px; }
.log-meta b { color: #94a3b8; font-weight: 600; }
.log-actions { display: flex; gap: 6px; flex-shrink: 0; }
.icon-btn {
    background: #13131f; border: 1px solid #2d2d4e; color: #94a3b8;
    width: 32px; height: 32px; border-radius: 6px; cursor: pointer; font-size: 14px;
}
.icon-btn:hover { border-color: #a78bfa; color: #e2e8f0; }
.icon-btn.danger:hover { border-color: #f43f5e; color: #f43f5e; }
.log-roles { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; }
.log-role-line { color: #cbd5e1; }
.log-role-line .won { color: #4ade80; }
.log-role-line .lost { color: #f97373; }
.log-notes { font-size: 12px; color: #64748b; font-style: italic; margin-top: 8px; }

/* ── Modal ── */
.modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 16px;
}
.modal {
    background: #13131f; border: 1px solid #2d2d4e; border-radius: 14px;
    width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 24px;
}
.modal h3 { font-size: 16px; margin-bottom: 16px; color: #f8fafc; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.btn-action {
    background: #7c3aed; color: #fff; border: none; padding: 11px 16px;
    border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700;
    text-transform: uppercase; flex: 1;
}
.btn-action:hover { background: #6d28d9; }
.btn-action.secondary { background: #1e293b; color: #e2e8f0; }
.player-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.field { margin-bottom: 12px; }
.field label { display: block; margin-bottom: 4px; }
.status-bar { text-align: center; padding: 40px 20px; color: #64748b; font-size: 13px; }
.hidden { display: none !important; }
.empty-hint { text-align: center; color: #475569; padding: 24px; font-size: 13px; }
</style>
</head>
<body>

<div class="header-bar">
    <div class="header-left">
        <img src="Img/logo.jpg" class="logo-img" alt="Logo">
        <div style="display:flex; flex-direction:column;">
            <span style="font-weight:700; font-size:14px; letter-spacing:0.5px;">О ИГРОВОМ АРХИВЕ</span>
            <span class="stamp">Статистика и логи</span>
        </div>
    </div>
    <div class="header-right">
        <span id="sync-status" class="sync-pill"><span class="sync-dot"></span><span id="sync-text">Загрузка…</span></span>
        <span id="auth-badge" class="sync-pill ok hidden"><span class="sync-dot"></span>Админ</span>
        <button type="button" id="btn-login" class="nav-btn" onclick="openAuthModal()">Войти</button>
        <button type="button" id="btn-logout" class="nav-btn hidden" onclick="signOut()">Выйти</button>
        <button type="button" class="nav-btn" onclick="forceRefresh()" title="Загрузить свежие данные">↻</button>
        <a href="https://stellarsnowfall.github.io/Dossier/" class="nav-btn">← Досье</a>
    </div>
</div>

<div id="page-loader" class="status-bar">Получение данных из облака…</div>

<div id="page-content" class="main-container hidden">

    <!-- Общий винрейт -->
    <section class="section-card">
        <div class="section-head">
            <span class="section-title">Общий винрейт</span>
            <span class="section-meta" id="total-games-label">0 партий</span>
        </div>
        <div class="winrate-grid" id="winrate-output"></div>
    </section>

    <!-- Статистика по ролям -->
    <section class="section-card">
        <div class="section-head">
            <span class="section-title">Статистика по ролям</span>
        </div>
        <div class="pills-row" id="game-pills"></div>
        <div class="table-wrap">
            <table class="role-table" id="role-matrix">
                <thead id="role-matrix-head"></thead>
                <tbody id="role-matrix-body"></tbody>
            </table>
        </div>
    </section>

    <!-- Архив -->
    <section class="section-card">
        <div class="section-head">
            <span class="section-title">Архив партий</span>
        </div>
        <div class="archive-toolbar">
            <div class="filters">
                <select id="filter-game" class="form-select" onchange="renderArchive()">
                    <option value="">Все игры</option>
                </select>
                <select id="filter-player" class="form-select" onchange="renderArchive()">
                    <option value="">Все игроки</option>
                </select>
                <select id="filter-mode" class="form-select" onchange="renderArchive()">
                    <option value="">Все форматы</option>
                    <option value="offline">Оффлайн</option>
                    <option value="online">Онлайн</option>
                </select>
            </div>
            <button class="nav-btn primary admin-only" onclick="openSessionModal()">+ Добавить</button>
            <button class="nav-btn admin-only" onclick="openSettingsModal()" title="Игры и игроки">⚙</button>
        </div>
        <div id="archive-output"></div>
    </section>
</div>

<!-- Modal: add/edit session -->
<div id="session-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeSessionModal()">
    <div class="modal">
        <h3 id="session-modal-title">Добавить партию</h3>
        <form onsubmit="event.preventDefault(); saveSession();">
            <div class="field">
                <label class="stamp">Дата</label>
                <input type="date" id="f-date" class="form-input" required>
            </div>
            <div class="field">
                <label class="stamp">Игра</label>
                <select id="f-game" class="form-select" style="width:100%" onchange="syncRoleDropdowns()" required></select>
            </div>
            <div class="field">
                <label class="stamp">Формат</label>
                <div id="mode-pills" class="pills-row tight">
                    <button type="button" class="pill sm toggle active" data-mode="offline" onclick="setSessionMode('offline', this)">Оффлайн</button>
                    <button type="button" class="pill sm toggle" data-mode="online" onclick="setSessionMode('online', this)">Онлайн</button>
                </div>
            </div>
            <div class="field">
                <label class="stamp">Участники</label>
                <div id="participants-pills" class="pills-row tight"></div>
            </div>
            <div class="field" style="background:#0a0a14;padding:12px;border-radius:8px;border:1px solid #2d2d4e;">
                <label class="stamp" style="color:#a78bfa;margin-bottom:8px;">Игроки и роли</label>
                <div id="form-players-root"></div>
                <button type="button" class="nav-btn" style="width:100%;margin-top:6px;font-size:12px;" onclick="addEmptyRoleRow()">+ Добавить роль</button>
            </div>
            <div class="field">
                <label class="stamp">Заметки</label>
                <input type="text" id="f-notes" class="form-input" placeholder="Необязательно">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-action secondary" onclick="closeSessionModal()">Отмена</button>
                <button type="submit" class="btn-action">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: admin login -->
<div id="auth-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeAuthModal()">
    <div class="modal">
        <h3>Вход администратора</h3>
        <p style="font-size:12px;color:#64748b;margin-bottom:14px;">
            Только вы сможете добавлять и менять партии. Друзья видят архив без входа.
        </p>
        <div class="field">
            <label class="stamp">Email</label>
            <input type="email" id="auth-email" class="form-input" placeholder="ваш@email.com" autocomplete="username">
        </div>
        <div class="field">
            <label class="stamp">Пароль</label>
            <input type="password" id="auth-password" class="form-input" placeholder="••••••••" autocomplete="current-password">
        </div>
        <p id="auth-error" style="font-size:12px;color:#fb7185;margin-bottom:10px;display:none;"></p>
        <div class="modal-actions">
            <button type="button" class="btn-action secondary" onclick="closeAuthModal()">Отмена</button>
            <button type="button" class="btn-action" onclick="signIn()">Войти</button>
        </div>
    </div>
</div>

<!-- Modal: settings (games + players) -->
<div id="settings-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeSettingsModal()">
    <div class="modal">
        <h3>Игроки и игры</h3>
        <div class="field">
            <label class="stamp">Игроки (по одному в строке)</label>
            <textarea id="cfg-players" class="form-input" rows="4" style="resize:vertical;"></textarea>
        </div>
        <div class="field">
            <label class="stamp">Игры — формат: <code>Название | Роль1, Роль2</code></label>
            <textarea id="cfg-games" class="form-input" rows="6" style="resize:vertical;font-family:monospace;font-size:12px;"></textarea>
        </div>
        <div class="modal-actions">
            <button type="button" class="btn-action secondary" onclick="closeSettingsModal()">Отмена</button>
            <button type="button" class="btn-action" onclick="saveSettings()">Сохранить</button>
        </div>
    </div>
</div>

<script>

// 'supabase' — рекомендуется для GitHub Pages: без лимита 10k, все видят одни данные
// 'github'   — только чтение из data/archive.json в репозитории (редактировать нельзя с сайта)

// Путь к JSON в репозитории (для GitHub Pages: положите data/archive.json в Dossier/)

// Не дергать JSONBin чаще чем раз в N минут (кнопка ↻ обновляет принудительно)
const CACHE_MINUTES = 60;
const CACHE_KEY = 'dossier_archive_v2';

const DEFAULT_STATE = {
    players: [
        'Медет',
        'Никита',
        'Танай',
        'Азирет',
        'Дияр',
        'Ануар',
        'Нурсултан',

    ],
    games: [

        { name: 'Манчкин', roles: [] }
    ],
    sessions: []
};

let STATE = structuredClone(DEFAULT_STATE);
let activeGameIndex = 0;
let editingSessionId = null;

function setSyncStatus(ok, text) {
    const el = document.getElementById('sync-status');
    const txt = document.getElementById('sync-text');
    el.className = 'sync-pill ' + (ok ? 'ok' : 'err');
    txt.textContent = text;
}

function normalizeLoaded(raw) {
    if (Array.isArray(raw)) {
        return { ...structuredClone(DEFAULT_STATE), sessions: raw };
    }
    if (raw && Array.isArray(raw.sessions)) {
        return {
            players: raw.players?.length ? raw.players : DEFAULT_STATE.players,
            games: raw.games?.length ? raw.games : DEFAULT_STATE.games,
            sessions: raw.sessions
        };
    }
    return structuredClone(DEFAULT_STATE);
}

function readCache() {
    try {
        const raw = sessionStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        const { savedAt, data } = JSON.parse(raw);
        if (Date.now() - savedAt > CACHE_MINUTES * 60 * 1000) return null;
        return data;
    } catch { return null; }
}

function writeCache(data) {
    try {
        sessionStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), data }));
    } catch { /* quota */ }
}

function jsonbinHeaders(json = false) {
    const h = { 'X-Bin-Meta': 'false' };
    if (json) h['Content-Type'] = 'application/json';
    if (API_KEY.startsWith('$2a$') || API_KEY.startsWith('$2b$')) h['X-Master-Key'] = API_KEY;
    else h['X-Access-Key'] = API_KEY;
    return h;
}

function supabaseHeaders(json = false, forWrite = false) {
    const token = (forWrite && authSession?.access_token) ? authSession.access_token : SUPABASE_KEY;
    const h = { apikey: SUPABASE_KEY, Authorization: `Bearer ${token}` };
    if (json) h['Content-Type'] = 'application/json';
    return h;
}

function isAdmin() {
    const email = authSession?.user?.email;
    return !!email && email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
}

function requireAdmin() {
    if (!isAdmin()) {
        alert('Редактирование доступно только администратору. Войдите под своим email.');
        openAuthModal();
        throw new Error('Not admin');
    }
}

function updateAdminUI() {
    const admin = isAdmin();
    const loggedIn = !!authSession;
    document.querySelectorAll('.admin-only').forEach(el => el.classList.toggle('hidden', !admin));
    document.getElementById('btn-login')?.classList.toggle('hidden', loggedIn);
    document.getElementById('btn-logout')?.classList.toggle('hidden', !loggedIn);
    document.getElementById('auth-badge')?.classList.toggle('hidden', !admin);
}

async function initAuth() {
    if (!SUPABASE_URL || !SUPABASE_KEY || typeof supabase === 'undefined') return;
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { data: { session } } = await supabaseClient.auth.getSession();
    authSession = session;
    updateAdminUI();
    supabaseClient.auth.onAuthStateChange((_event, session) => {
        authSession = session;
        updateAdminUI();
        if (document.getElementById('page-content') && !document.getElementById('page-content').classList.contains('hidden')) {
            renderArchive();
        }
    });
}

function openAuthModal() {
    document.getElementById('auth-error').style.display = 'none';
    document.getElementById('auth-email').value = ADMIN_EMAIL.includes('@example.com') ? '' : ADMIN_EMAIL;
    document.getElementById('auth-modal').classList.remove('hidden');
}

function closeAuthModal() {
    document.getElementById('auth-modal').classList.add('hidden');
}

async function signIn() {
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const errEl = document.getElementById('auth-error');
    errEl.style.display = 'none';
    if (!supabaseClient) {
        errEl.textContent = 'Supabase SDK не загрузился.';
        errEl.style.display = 'block';
        return;
    }
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
        errEl.textContent = error.message;
        errEl.style.display = 'block';
        return;
    }
    authSession = data.session;
    updateAdminUI();
    closeAuthModal();
    document.getElementById('auth-password').value = '';
    if (!isAdmin()) {
        alert(`Вы вошли как ${email}, но этот email не является администратором.`);
        await signOut();
    }
}

async function signOut() {
    if (supabaseClient) await supabaseClient.auth.signOut();
    authSession = null;
    updateAdminUI();
    renderArchive();
}

async function fetchJsonbin() {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, { headers: jsonbinHeaders() });
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `JSONBin ${res.status}`);
    }
    const result = await res.json();
    return normalizeLoaded(result.record ?? result);
}

async function saveJsonbin() {
    const headers = jsonbinHeaders(true);
    headers['X-Bin-Versioning'] = 'false';
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT', headers, body: JSON.stringify(STATE)
    });
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `JSONBin ${res.status}`);
    }
}

async function fetchSupabase() {
    if (!SUPABASE_URL || !SUPABASE_KEY) {
        throw new Error('Заполните SUPABASE_URL и SUPABASE_KEY в начале скрипта');
    }
    const res = await fetch(
        `${SUPABASE_URL}/rest/v1/archive?id=eq.1&select=data`,
        { headers: supabaseHeaders() }
    );
    if (!res.ok) throw new Error(`Supabase ${res.status}`);
    const rows = await res.json();
    if (!rows.length) return structuredClone(DEFAULT_STATE);
    return normalizeLoaded(rows[0].data);
}

async function saveSupabase() {
    if (!SUPABASE_URL || !SUPABASE_KEY) {
        throw new Error('Заполните SUPABASE_URL и SUPABASE_KEY');
    }
    if (!isAdmin()) {
        throw new Error('Нет прав на запись. Войдите как администратор.');
    }
    const res = await fetch(`${SUPABASE_URL}/rest/v1/archive?id=eq.1`, {
        method: 'PATCH',
        headers: { ...supabaseHeaders(true, true), Prefer: 'return=minimal' },
        body: JSON.stringify({ data: STATE, updated_at: new Date().toISOString() })
    });
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        const msg = err.message || err.hint || `Supabase ${res.status}`;
        if (res.status === 401 || res.status === 403) {
            throw new Error(`Доступ запрещён: ${msg}. Проверьте RLS и email в supabase-auth-setup.sql`);
        }
        throw new Error(msg);
    }
}

async function fetchGithubJson() {
    const res = await fetch(GITHUB_DATA_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error(`Файл ${GITHUB_DATA_URL} не найден (${res.status})`);
    return normalizeLoaded(await res.json());
}

async function fetchRemote(force = false) {
    if (STORAGE === 'github') return fetchGithubJson();
    if (STORAGE === 'supabase') return fetchSupabase();
    if (!force) {
        const cached = readCache();
        if (cached) return cached;
    }
    const data = await fetchJsonbin();
    writeCache(data);
    return data;
}

async function saveRemote() {
    if (STORAGE === 'github') {
        throw new Error('Режим github — только чтение. Переключите STORAGE на jsonbin или supabase.');
    }
    if (STORAGE === 'supabase') await saveSupabase();
    else await saveJsonbin();
    writeCache(STATE);
}

function showPage() {
    document.getElementById('page-loader').classList.add('hidden');
    document.getElementById('page-content').classList.remove('hidden');
}

async function loadCloudData(force = false) {
    const cached = !force && readCache();
    if (cached) {
        STATE = cached;
        showPage();
        refreshAll();
        updateAdminUI();
        setSyncStatus(true, 'Кэш · общий архив');
    }

    try {
        const fresh = await fetchRemote(force);
        STATE = fresh;
        writeCache(fresh);
        showPage();
        refreshAll();
        updateAdminUI();
        const labels = { jsonbin: 'JSONBin', supabase: 'Supabase', github: 'GitHub' };
        setSyncStatus(true, isAdmin() ? `${labels[STORAGE] || 'Онлайн'} · админ` : (labels[STORAGE] || 'Онлайн'));
    } catch (e) {
        if (cached) {
            setSyncStatus(false, 'Офлайн · кэш');
            console.warn(e);
            return;
        }
        setSyncStatus(false, 'Нет связи');
        document.getElementById('page-loader').textContent =
            `Не удалось загрузить архив: ${e.message}`;
        console.error(e);
    }
}

function forceRefresh() {
    sessionStorage.removeItem(CACHE_KEY);
    document.getElementById('page-loader').classList.remove('hidden');
    document.getElementById('page-loader').textContent = 'Обновление…';
    loadCloudData(true).then(() => {
        document.getElementById('page-loader').classList.add('hidden');
    });
}

async function pushToCloud() {
    requireAdmin();
    await saveRemote();
    setSyncStatus(true, isAdmin() ? 'Сохранено · админ' : 'Supabase');
}

function refreshAll() {
    populateFilters();
    renderWinrate();
    renderGamePills();
    renderRoleMatrix();
    renderArchive();
}

function partyCount() {
    return STATE.sessions.length;
}

function gamesLabel(n) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return `${n} партия`;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return `${n} партии`;
    return `${n} партий`;
}

/** Цвет названия игры в архиве */
function getGameColor(gameName) {
    const key = (gameName || '').toLowerCase().trim();
    if (key.includes('письма') && key.includes('призрак')) return '#1e40af';
    if (key.includes('кракен')) return '#eab308';
    if (key.includes('судный')) return '#a78bfa';
    if (key.includes('гитлер')) return '#ef4444';
    if (key.includes('доминион')) return '#f8fafc';
    if (key.includes('манчкин')) return '#94a3b8';
    return '#a78bfa';
}

const WINRATE_RANK_MIN_GAMES = 10;

function buildWinrateStats() {
    const counts = {};
    STATE.players.forEach(p => { counts[p] = { w: 0, l: 0, t: 0, lastWin: null }; });

    STATE.sessions.forEach(s => {
        const sessionDate = s.date ? new Date(s.date) : null;
        const sessionTime = sessionDate && !isNaN(sessionDate) ? sessionDate.getTime() : null;
        (s.roles || []).forEach(r => {
            if (!counts[r.player]) return;
            counts[r.player].t++;
            if (r.won) {
                counts[r.player].w++;
                if (sessionTime !== null && (!counts[r.player].lastWin || sessionTime > counts[r.player].lastWin)) {
                    counts[r.player].lastWin = sessionTime;
                }
            } else {
                counts[r.player].l++;
            }
        });
    });

    return counts;
}

function compareWinratePlayers(a, b) {
    if (b.pct !== a.pct) return b.pct - a.pct;
    if (b.t !== a.t) return b.t - a.t;
    return (b.lastWin ?? -Infinity) - (a.lastWin ?? -Infinity);
}

function getWinrateRankMap(counts) {
    const eligible = STATE.players
        .map(name => {
            const c = counts[name];
            const pct = c.t ? Math.round((c.w / c.t) * 100) : 0;
            return { name, w: c.w, l: c.l, t: c.t, pct, lastWin: c.lastWin };
        })
        .filter(p => p.t >= WINRATE_RANK_MIN_GAMES)
        .sort(compareWinratePlayers);

    const rankMap = new Map();
    const rankClasses = ['rank-gold', 'rank-silver', 'rank-bronze'];
    let slot = 0;

    for (let i = 0; i < eligible.length && slot < 3; i++) {
        if (i > 0 && compareWinratePlayers(eligible[i - 1], eligible[i]) === 0) {
            rankMap.set(eligible[i].name, rankMap.get(eligible[i - 1].name));
        } else {
            rankMap.set(eligible[i].name, rankClasses[slot]);
            slot++;
        }
    }

    return rankMap;
}

// ── 1. Общий винрейт (карточки как на макете) ──
function renderWinrate() {
    const root = document.getElementById('winrate-output');
    document.getElementById('total-games-label').textContent = gamesLabel(partyCount());

    const counts = buildWinrateStats();
    const rankMap = getWinrateRankMap(counts);

    root.innerHTML = '';
    STATE.players.forEach(name => {
        const c = counts[name];
        const pct = c.t ? Math.round((c.w / c.t) * 100) : 0;
        const color = winratePctColor(pct);
        const rankClass = rankMap.get(name) || '';

        const card = document.createElement('div');
        card.className = 'win-card' + (rankClass ? ` ${rankClass}` : '');
        card.innerHTML = `
            <div class="name">${name}</div>
            <div class="pct" style="color:${color}">${pct}%</div>
            <div class="sub">
                <span style="color:#4ade80">${c.w}В</span>
                <span style="color:#fb7185; margin-left:4px;">${c.l}П</span>
                <span style="color:#64748b; margin-left:4px;">${c.t}и</span>
            </div>
            <div class="bar"><div class="bar-fill" style="width:${pct}%; background:${color}; box-shadow:0 0 6px ${color}80;"></div></div>
        `;
        root.appendChild(card);
    });
}

// ── 2. Матрица ролей (игрок × роль → В / П / %) ──
function renderGamePills() {
    const row = document.getElementById('game-pills');
    row.innerHTML = '';
    if (!STATE.games.length) {
        row.innerHTML = '<span class="empty-hint">Добавьте игры в ⚙ настройках</span>';
        return;
    }
    if (activeGameIndex >= STATE.games.length) activeGameIndex = 0;

    STATE.games.forEach((g, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pill' + (i === activeGameIndex ? ' active' : '');
        btn.textContent = g.name;
        btn.onclick = () => { activeGameIndex = i; renderGamePills(); renderRoleMatrix(); };
        row.appendChild(btn);
    });
}

function cellStats(map, player, role) {
    const key = `${player}|||${role}`;
    const s = map[key];
    if (!s || !s.t) return { w: '—', l: '—', pct: '—', raw: null };
    const l = s.t - s.w;
    const pct = Math.round((s.w / s.t) * 100);
    return { w: s.w, l, pct: `${pct}%`, raw: pct };
}

/** Общий винрейт: ≤25 тёмно-красный … 75+ бирюзовый */
function winratePctColor(pct) {
    if (pct <= 25) return '#991b1b';
    if (pct <= 36) return '#fb7185';
    if (pct <= 49) return '#facc15';
    if (pct <= 60) return '#4ade80';
    if (pct <= 74) return '#16a34a';
    return '#22d3ee';
}

/** Статистика по ролям: 100 бирюзовый … 0–9 чёрно-красный */
function rolePctColor(raw) {
    if (raw === null || raw === undefined) return '#64748b';
    if (raw >= 100) return '#22d3ee';
    if (raw >= 80) return '#16a34a';
    if (raw >= 65) return '#4ade80';
    if (raw >= 50) return '#facc15';
    if (raw >= 30) return '#fb7185';
    if (raw >= 10) return '#991b1b';
    return '#450a0a';
}

function renderRoleMatrix() {
    const head = document.getElementById('role-matrix-head');
    const body = document.getElementById('role-matrix-body');
    const game = STATE.games[activeGameIndex];
    if (!game) {
        head.innerHTML = '';
        body.innerHTML = '<tr><td class="empty-hint" colspan="99">Нет игр в конфиге</td></tr>';
        return;
    }

    const roles = game.roles || [];
    const sessions = STATE.sessions.filter(s => s.game === game.name);

    // Игры без ролей (Доминион, Манчкин): простая таблица В / П / %
    if (!roles.length) {
        head.innerHTML = `
            <tr>
                <th class="player-col">Игрок</th>
                <th class="group">В</th>
                <th class="group">П</th>
                <th class="group">%</th>
            </tr>
        `;

        const map = {};
        sessions.forEach(s => {
            (s.roles || []).forEach(r => {
                if (!map[r.player]) map[r.player] = { t: 0, w: 0 };
                map[r.player].t++;
                if (r.won) map[r.player].w++;
            });
        });

        const playersInGame = new Set(Object.keys(map));
        const rows = STATE.players.filter(p => playersInGame.has(p));
        if (!rows.length) rows.push(...STATE.players);

        body.innerHTML = '';
        rows.forEach(player => {
            const s = map[player];
            const tr = document.createElement('tr');
            if (!s || !s.t) {
                tr.innerHTML = `
                    <td class="player-name">${player}</td>
                    <td class="group"><span class="dash">—</span></td>
                    <td class="group"><span class="dash">—</span></td>
                    <td class="group pct-cell"><span class="dash">—</span></td>
                `;
            } else {
                const l = s.t - s.w;
                const raw = Math.round((s.w / s.t) * 100);
                const clr = rolePctColor(raw);
                tr.innerHTML = `
                    <td class="player-name">${player}</td>
                    <td class="group" style="color:#4ade80;">${s.w}</td>
                    <td class="group" style="color:#fb7185;">${l}</td>
                    <td class="group pct-cell" style="color:${clr};">${raw}%</td>
                `;
            }
            body.appendChild(tr);
        });
        return;
    }

    let headRow1 = '<tr><th class="player-col">Игрок</th>';
    let headRow2 = '<tr><th class="player-col"></th>';
    roles.forEach(r => {
        headRow1 += `<th class="group" colspan="3">${r}</th>`;
        headRow2 += '<th class="group">В</th><th class="group">П</th><th class="group">%</th>';
    });
    headRow1 += '<th class="group" colspan="3">Итого</th></tr>';
    headRow2 += '<th class="group">В</th><th class="group">П</th><th class="group">%</th></tr>';
    head.innerHTML = headRow1 + headRow2;

    const map = {};
    sessions.forEach(s => {
        (s.roles || []).forEach(r => {
            const key = `${r.player}|||${r.role || ''}`;
            if (!map[key]) map[key] = { t: 0, w: 0 };
            map[key].t++;
            if (r.won) map[key].w++;
        });
    });

    const playersInGame = new Set();
    sessions.forEach(s =>
        (s.roles || []).forEach(r => playersInGame.add(r.player))
    );
    const rows = STATE.players.filter(p => playersInGame.has(p));
    if (!rows.length) rows.push(...STATE.players);

    body.innerHTML = '';
    rows.forEach(player => {
        let totalT = 0, totalW = 0;
        let cells = `<td class="player-name">${player}</td>`;

        roles.forEach(role => {
            const st = cellStats(map, player, role);
            if (st.raw !== null) { totalT += map[`${player}|||${role}`].t; totalW += map[`${player}|||${role}`].w; }
            const dash = v => v === '—' ? '<span class="dash">—</span>' : v;
            const pctClr = rolePctColor(st.raw);
            cells += `
                <td class="group" style="color:#4ade80;">${dash(st.w)}</td>
                <td class="group" style="color:#fb7185;">${dash(st.l)}</td>
                <td class="group pct-cell" style="color:${pctClr};">${dash(st.pct)}</td>
            `;
        });

        const totL = totalT - totalW;
        const totRaw = totalT ? Math.round((totalW / totalT) * 100) : null;
        const totPct = totalT ? `${totRaw}%` : '—';
        const totClr = rolePctColor(totRaw);
        cells += `<td class="group" style="color:#4ade80;">${totalT ? totalW : '<span class="dash">—</span>'}</td>`;
        cells += `<td class="group" style="color:#fb7185;">${totalT ? totL : '<span class="dash">—</span>'}</td>`;
        cells += `<td class="group pct-cell" style="color:${totClr};">${totalT ? totPct : '<span class="dash">—</span>'}</td>`;

        const tr = document.createElement('tr');
        tr.innerHTML = cells;
        body.appendChild(tr);
    });
}

// ── 3. Архив с фильтрами и группировкой по дате ──
function populateFilters() {
    const fg = document.getElementById('filter-game');
    const fp = document.getElementById('filter-player');
    const fm = document.getElementById('filter-mode');
    const gVal = fg.value, pVal = fp.value, mVal = fm?.value || '';

    fg.innerHTML = '<option value="">Все игры</option>' +
        STATE.games.map(g => `<option value="${g.name}">${g.name}</option>`).join('');
    fp.innerHTML = '<option value="">Все игроки</option>' +
        STATE.players.map(p => `<option value="${p}">${p}</option>`).join('');

    fg.value = gVal;
    fp.value = pVal;
    if (fm) fm.value = mVal;
    syncGameSelect();
}

function sessionMode(s) {
    return s.mode === 'online' ? 'online' : 'offline';
}

function syncGameSelect() {
    const sel = document.getElementById('f-game');
    sel.innerHTML = STATE.games.map(g => `<option value="${g.name}">${g.name}</option>`).join('');
}

function renderArchive() {
    const root = document.getElementById('archive-output');
    const fGame = document.getElementById('filter-game').value;
    const fPlayer = document.getElementById('filter-player').value;
    const fMode = document.getElementById('filter-mode')?.value || '';

    let list = [...STATE.sessions].sort((a, b) => new Date(b.date) - new Date(a.date));
    if (fGame) list = list.filter(s => s.game === fGame);
    if (fPlayer) list = list.filter(s => (s.roles || []).some(r => r.player === fPlayer));
    if (fMode) list = list.filter(s => sessionMode(s) === fMode);

    if (!list.length) {
        const filtered = fGame || fPlayer || fMode;
        root.innerHTML = filtered
            ? '<div class="empty-hint">Нет партий по выбранным фильтрам.</div>'
            : (isAdmin()
                ? '<div class="empty-hint">Пока нет партий. Нажмите «+ Добавить».</div>'
                : '<div class="empty-hint">Пока нет партий в архиве.</div>');
        return;
    }

    const byDate = {};
    list.forEach(s => {
        const key = s.date || 'unknown';
        if (!byDate[key]) byDate[key] = [];
        byDate[key].push(s);
    });

    root.innerHTML = '';
    Object.keys(byDate).sort((a, b) => new Date(b) - new Date(a)).forEach(dateKey => {
        const d = new Date(dateKey);
        const label = isNaN(d)
            ? dateKey
            : d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();

        const lbl = document.createElement('div');
        lbl.className = 'date-label';
        lbl.textContent = label;
        root.appendChild(lbl);

        byDate[dateKey].forEach(s => {
            const participants = (s.roles || []).map(r => r.player).join(', ');
            const modeLabel = (s.mode === 'online') ? 'Онлайн' : 'Оффлайн';
            const rolesHtml = (s.roles || []).map(r => {
                const mark = r.won ? '<span class="won">✓</span>' : '<span class="lost">✗</span>';
                const rolePart = r.role ? `${r.role} ` : '';
                return `<span class="log-role-line">${r.player}: ${rolePart}${mark}</span>`;
            }).join('');

            const adminActions = isAdmin() ? `
                    <div class="log-actions admin-only">
                        <button class="icon-btn" title="Изменить" onclick="editSession(${s.id})">✎</button>
                        <button class="icon-btn danger" title="Удалить" onclick="deleteSession(${s.id})">×</button>
                    </div>` : '';

            const gameColor = getGameColor(s.game);
            const card = document.createElement('div');
            card.className = 'log-card';
            card.innerHTML = `
                <div class="log-top">
                    <div>
                        <div class="log-game" style="color:${gameColor}">${s.game}</div>
                        <div class="log-meta">Формат: <b>${modeLabel}</b> · Участники: <b>${participants || '—'}</b></div>
                    </div>
                    ${adminActions}
                </div>
                <div class="log-roles">${rolesHtml}</div>
                ${s.notes ? `<div class="log-notes">${s.notes}</div>` : ''}
            `;
            root.appendChild(card);
        });
    });
}

    editingSessionId = null;
    document.getElementById('session-modal-title').textContent = 'Добавить партию';
    document.getElementById('f-date').valueAsDate = new Date();

    syncRoleDropdowns();

}

function closeSessionModal() {
    document.getElementById('session-modal').classList.add('hidden');
    editingSessionId = null;
}

function editSession(id) {
    try { requireAdmin(); } catch { return; }
    const s = STATE.sessions.find(x => x.id === id);
    if (!s) return;
    editingSessionId = id;
    document.getElementById('session-modal-title').textContent = 'Изменить партию';
    document.getElementById('f-date').value = s.date;
    document.getElementById('f-game').value = s.game;
    document.getElementById('f-notes').value = s.notes || '';
    document.getElementById('form-players-root').innerHTML = '';
    setSessionMode(s.mode === 'online' ? 'online' : 'offline');
    const selected = Array.from(new Set((s.roles || []).map(r => r.player)));
    renderParticipantsPills(selected, true);
    (s.roles || []).forEach(r => addRoleRow(r.player, r.role, r.won));
    syncRoleDropdowns();
    document.getElementById('session-modal').classList.remove('hidden');
}

function addRoleRow(presetPlayer = '', presetRole = '', presetWon = true) {
    const root = document.getElementById('form-players-root');
    const div = document.createElement('div');
    div.className = 'player-row';
    const pOpts = STATE.players.map(p =>
        `<option value="${p}" ${presetPlayer === p ? 'selected' : ''}>${p}</option>`
    ).join('') + '<option value="Гость">[Гость]</option>';
    div.innerHTML = `
        <select class="form-select src-p" style="flex:1">${pOpts}</select>
        <select class="form-select src-r" style="flex:1.2"></select>
        <select class="form-select src-w" style="width:88px">
            <option value="true">Вин</option>
            <option value="false">Лоз</option>
        </select>
        <button type="button" class="icon-btn danger" onclick="this.parentElement.remove()">×</button>
    `;
    root.appendChild(div);
    syncRoleDropdowns();
    const row = root.lastElementChild;
    if (presetRole) row.querySelector('.src-r').value = presetRole;
    row.querySelector('.src-w').value = presetWon ? 'true' : 'false';
}

function rolesForGame(name) {
    const g = STATE.games.find(x => x.name === name);
    return g ? g.roles : [];
}

function syncRoleDropdowns() {
    const roles = rolesForGame(document.getElementById('f-game').value);
    document.querySelectorAll('.player-row').forEach(row => {
        const sel = row.querySelector('.src-r');
        const prev = sel.value;
        if (!roles.length) {
            sel.innerHTML = '<option value="">—</option>';
            sel.value = '';
            sel.disabled = true;
        } else {
            sel.disabled = false;
            sel.innerHTML = roles.map(r => `<option value="${r}">${r}</option>`).join('');
            if (roles.includes(prev)) sel.value = prev;
        }
    });
}

function addEmptyRoleRow() {
    addRoleRow('', '', true);
}

function getSelectedParticipants() {
    return Array.from(document.querySelectorAll('#participants-pills .pill.toggle.active'))
        .map(b => b.getAttribute('data-player'))
        .filter(Boolean);
}

function setSessionMode(mode, btnEl) {
    document.querySelectorAll('#mode-pills .pill.toggle').forEach(b => b.classList.remove('active'));
    const btn = btnEl || document.querySelector(`#mode-pills .pill.toggle[data-mode="${mode}"]`);
    if (btn) btn.classList.add('active');
}

function getSessionMode() {
    const active = document.querySelector('#mode-pills .pill.toggle.active');
    return active?.getAttribute('data-mode') === 'online' ? 'online' : 'offline';
}

function renderParticipantsPills(selectedPlayers, skipSync = false) {
    const root = document.getElementById('participants-pills');
    if (!root) return;
    const set = new Set(selectedPlayers || []);
    root.innerHTML = '';
    STATE.players.forEach(p => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pill sm toggle' + (set.has(p) ? ' active' : '');
        btn.textContent = p;
        btn.setAttribute('data-player', p);
        btn.onclick = () => {
            btn.classList.toggle('active');
            syncRolesWithParticipants();
        };
        root.appendChild(btn);
    });
    if (!skipSync) syncRolesWithParticipants();
}

function syncRolesWithParticipants() {
    const selected = new Set(getSelectedParticipants());
    const root = document.getElementById('form-players-root');
    if (!root) return;

    // remove rows whose player is no longer selected
    Array.from(root.querySelectorAll('.player-row')).forEach(row => {
        const p = row.querySelector('.src-p')?.value;
        if (p && STATE.players.includes(p) && !selected.has(p)) row.remove();
    });

    // add missing rows for selected players
    const existing = new Set(
        Array.from(root.querySelectorAll('.player-row .src-p'))
            .map(sel => sel.value)
            .filter(Boolean)
    );
    selected.forEach(p => {
        if (!existing.has(p)) addRoleRow(p, '', true);
    });
}

async function saveSession() {
    const date = document.getElementById('f-date').value;
    const game = document.getElementById('f-game').value;
    const mode = getSessionMode();
    const notes = document.getElementById('f-notes').value.trim();
    const rows = document.querySelectorAll('.player-row');
    if (!rows.length) return alert('Выберите хотя бы одного участника.');

    const roles = [];
    const seen = new Set();
    rows.forEach(r => {
        const player = r.querySelector('.src-p').value;
        const roleValue = r.querySelector('.src-r').disabled ? '' : r.querySelector('.src-r').value;
        const key = `${player}|||${roleValue}`;
        if (seen.has(key)) return;
        seen.add(key);
        roles.push({
            player,
            role: roleValue,
            won: r.querySelector('.src-w').value === 'true'
        });
    });

    const session = { id: editingSessionId || Date.now(), date, game, mode, notes, roles };

    if (editingSessionId) {
        const i = STATE.sessions.findIndex(s => s.id === editingSessionId);
        if (i >= 0) STATE.sessions[i] = session;
    } else {
        STATE.sessions.unshift(session);
    }

    try {
        await pushToCloud();
        closeSessionModal();
        refreshAll();
    } catch (e) {
        alert(`Ошибка сохранения: ${e.message}`);
        await loadCloudData(true);
    }
}

async function deleteSession(id) {
    try { requireAdmin(); } catch { return; }
    if (!confirm('Удалить эту партию из архива?')) return;
    STATE.sessions = STATE.sessions.filter(s => s.id !== id);
    try {
        await pushToCloud();
        refreshAll();
    } catch (e) {
        alert(`Ошибка: ${e.message}`);
        await loadCloudData(true);
    }
}

// ── Settings: dynamic games & players ──
function openSettingsModal() {
    try { requireAdmin(); } catch { return; }
    document.getElementById('cfg-players').value = STATE.players.join('\n');
    document.getElementById('cfg-games').value = STATE.games
        .map(g => `${g.name} | ${g.roles.join(', ')}`).join('\n');
    document.getElementById('settings-modal').classList.remove('hidden');
}

function closeSettingsModal() {
    document.getElementById('settings-modal').classList.add('hidden');
}

function parseGamesText(text) {
    return text.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
        const [name, rolesPart] = line.split('|').map(s => s.trim());
        const roles = (rolesPart || 'Игрок').split(',').map(r => r.trim()).filter(Boolean);
        return { name, roles };
    });
}

async function saveSettings() {
    const players = document.getElementById('cfg-players').value
        .split('\n').map(s => s.trim()).filter(Boolean);
    const games = parseGamesText(document.getElementById('cfg-games').value);
    if (!players.length || !games.length) {
        return alert('Нужен хотя бы один игрок и одна игра.');
    }
    STATE.players = players;
    STATE.games = games;
    try {
        await pushToCloud();
        closeSettingsModal();
        refreshAll();
        alert('Настройки сохранены.');
    } catch (e) {
        alert(`Ошибка: ${e.message}`);
    }
}

window.addEventListener('DOMContentLoaded', async () => {
    await initAuth();
    await loadCloudData();
});
</script>
